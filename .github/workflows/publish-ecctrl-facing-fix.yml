name: Publish Ecctrl attack-facing fix

on:
  push:
    branches:
      - agent/ecctrl-warden-weapon-animation

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/ecctrl-lab-source/package-lock.json
      - name: Install Ecctrl sandbox dependencies
        working-directory: tools/ecctrl-lab-source
        run: npm ci
      - name: Verify controller and combat adapter
        working-directory: tools/ecctrl-lab-source
        run: |
          npm run typecheck
          npm run verify:combat
      - name: Build static Ecctrl sandbox
        working-directory: tools/ecctrl-lab-source
        run: npm run build
      - name: Verify Enemy Lab contract
        run: node tests/enemy-lab-ecctrl-sandbox.test.mjs
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/ecctrl-lab/assets/ecctrl-lab.js tools/ecctrl-lab/assets/ecctrl-lab.css
          git rm .github/workflows/publish-ecctrl-facing-fix.yml
          git diff --cached --check
          git commit -m "Generate Ecctrl facing-fix artifacts"
          git push
