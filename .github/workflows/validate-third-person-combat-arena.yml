name: Validate third-person combat arena

on:
  push:
    branches:
      - agent/combat-arena-third-person

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/combat-arena-third-person
          fetch-depth: 0

      - name: Extract module and check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('combat-arena.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script type="module">(.*?)</script>', source, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one module script, found {len(scripts)}')
          Path('/tmp/combat-arena.mjs').write_text(scripts[0], encoding='utf-8')
          required = [
              'THIRD_PERSON_CAMERA', 'toggleLock()', 'cameraCollisionT',
              'cameraForwardFlat', 'right-side camera drag', 'id="lockReticle"'
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('Missing third-person features: ' + ', '.join(missing))
          print('Third-person feature anchors present')
          PY
          node --check /tmp/combat-arena.mjs

      - name: Remove one-time validation workflow
        run: rm .github/workflows/validate-third-person-combat-arena.yml

      - name: Commit workflow cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-third-person-combat-arena.yml
          git commit -m "Remove third-person validation workflow"
          git push origin HEAD:agent/combat-arena-third-person
