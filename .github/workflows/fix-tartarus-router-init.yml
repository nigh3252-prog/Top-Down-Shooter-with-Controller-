name: Fix Tartarus router initialization

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/tartarus-native-mix
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix initialization order
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/arena-enemies-core.js')
          text = path.read_text()
          old = "  const setCombatDirectorEnabled=(system,enabled)=>system?.setCombatDirectorEnabled?.(enabled);"
          new = "  function setCombatDirectorEnabled(system,enabled){system?.setCombatDirectorEnabled?.(enabled);}"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one helper declaration, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Validate fix
        run: |
          node --check src/arena-enemies-core.js
          npm run test:hades
          npm run test:encounters
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-tartarus-router-init.yml
          git add src/arena-enemies-core.js
          git commit -m "Fix Tartarus router initialization order"
          git push origin HEAD:agent/tartarus-native-mix