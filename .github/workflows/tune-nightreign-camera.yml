name: Tune combat arena camera framing

on:
  push:
    branches:
      - agent/combat-arena-third-person

permissions:
  contents: write

jobs:
  tune-camera:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out third-person branch
        uses: actions/checkout@v4
        with:
          ref: agent/combat-arena-third-person
          fetch-depth: 0

      - name: Apply pulled-back camera pass
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('combat-arena.html')
          source = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
          '''const THIRD_PERSON_CAMERA = {
            fov:58, distance:7.2, shoulder:.58, pivotHeight:1.82,
            minPitch:.06, maxPitch:.58, startPitch:.28,
            yawSpeed:2.45, pitchSpeed:1.65, touchYaw:.0062, touchPitch:.0052,
            collisionPadding:.055, softAimDegrees:38,
          };''',
          '''const THIRD_PERSON_CAMERA = {
            fov:54, distance:12, lockDistance:13, shoulder:.32, pivotHeight:2.35,
            minPitch:11*Math.PI/180, maxPitch:40*Math.PI/180, startPitch:25*Math.PI/180,
            yawSpeed:2.45, pitchSpeed:1.65, touchYaw:.0062, touchPitch:.0052,
            lookAhead:5, lookHeight:1.15, lockRise:.35,
            collisionPadding:.045, wallHeight:3.2, softAimDegrees:38,
          };''',
          'camera configuration')

          replace_once(
          '''function cameraCollisionT(start,end,right){
            let safeT=1;
            for(const offset of [-.30,0,.30]){
              const a={x:start.x+right.x*offset,z:start.z+right.z*offset};
              const b={x:end.x+right.x*offset,z:end.z+right.z*offset};
              const hit=raycastWalls(a,b,mazeWorld.getCollisionSegments());
              if(hit) safeT=Math.min(safeT,Math.max(.035,hit.t-THIRD_PERSON_CAMERA.collisionPadding));
            }
            return safeT;
          }''',
          '''function cameraCollisionT(start,end,right){
            let safeT=1;
            for(const offset of [-.34,0,.34]){
              const a={x:start.x+right.x*offset,z:start.z+right.z*offset};
              const b={x:end.x+right.x*offset,z:end.z+right.z*offset};
              const hit=raycastWalls(a,b,mazeWorld.getCollisionSegments());
              if(!hit) continue;
              const rayHeight=lerp(start.y,end.y,hit.t);
              // The maze collision data is two-dimensional. Only pull the camera in
              // when the three-dimensional camera ray is still below the wall top.
              if(rayHeight<=THIRD_PERSON_CAMERA.wallHeight+.12){
                safeT=Math.min(safeT,Math.max(.035,hit.t-THIRD_PERSON_CAMERA.collisionPadding));
              }
            }
            return safeT;
          }''',
          'height-aware camera collision')

          replace_once(
          '''  const j=HitFeel.jitter*.24,kick=HitFeel.camKick,zk=HitFeel.zoomKick;
            const f=cameraForwardFlat(),r=cameraRightFlat();
            const pivot=scratchCamera.pivot.set(actorPos.x,THIRD_PERSON_CAMERA.pivotHeight,actorPos.y);
            const horizontal=Math.cos(cameraRig.pitch)*(THIRD_PERSON_CAMERA.distance-zk*.45-transitionView.cameraPush*.45);
            const shoulder=cameraRig.lockTarget ? THIRD_PERSON_CAMERA.shoulder*.52 : THIRD_PERSON_CAMERA.shoulder;
            scratchCamera.desired.set(
              pivot.x-f.x*horizontal+r.x*shoulder,
              pivot.y+Math.sin(cameraRig.pitch)*THIRD_PERSON_CAMERA.distance,
              pivot.z-f.z*horizontal+r.z*shoulder,
            );''',
          '''  const j=HitFeel.jitter*.14,kick=HitFeel.camKick,zk=HitFeel.zoomKick;
            const f=cameraForwardFlat(),r=cameraRightFlat();
            const pivot=scratchCamera.pivot.set(actorPos.x,THIRD_PERSON_CAMERA.pivotHeight,actorPos.y);
            const cameraDistance=cameraRig.lockTarget ? THIRD_PERSON_CAMERA.lockDistance : THIRD_PERSON_CAMERA.distance;
            const horizontal=Math.cos(cameraRig.pitch)*(cameraDistance-zk*.28-transitionView.cameraPush*.45);
            const shoulder=cameraRig.lockTarget ? THIRD_PERSON_CAMERA.shoulder*.25 : THIRD_PERSON_CAMERA.shoulder;
            scratchCamera.desired.set(
              pivot.x-f.x*horizontal+r.x*shoulder,
              pivot.y+Math.sin(cameraRig.pitch)*cameraDistance+(cameraRig.lockTarget?THIRD_PERSON_CAMERA.lockRise:0),
              pivot.z-f.z*horizontal+r.z*shoulder,
            );''',
          'camera distance and height')

          replace_once(
          '''  const followRate=desiredDistance<currentDistance ? 32 : 13;
            cameraRig.currentPosition.lerp(scratchCamera.corrected,1-Math.exp(-rawDt*followRate));

            camera.position.copy(cameraRig.currentPosition);
            camera.position.x+=shake.x*.22+(Math.random()*2-1)*j+kick.x*.22;
            camera.position.y+=shake.y*.16+(Math.random()*2-1)*j*.35+kick.y*.18;
            camera.position.z+=shake.z*.22+(Math.random()*2-1)*j+kick.z*.22;''',
          '''  const followRate=desiredDistance<currentDistance ? 38 : 8.5;
            cameraRig.currentPosition.lerp(scratchCamera.corrected,1-Math.exp(-rawDt*followRate));

            camera.position.copy(cameraRig.currentPosition);
            camera.position.x+=shake.x*.13+(Math.random()*2-1)*j+kick.x*.12;
            camera.position.y+=shake.y*.10+(Math.random()*2-1)*j*.30+kick.y*.10;
            camera.position.z+=shake.z*.13+(Math.random()*2-1)*j+kick.z*.12;''',
          'camera smoothing and impact motion')

          replace_once(
          '''    scratchCamera.lookAt.set(
                lerp(actorPos.x,target.x,.28),
                lerp(THIRD_PERSON_CAMERA.pivotHeight,enemyTargetHeight(target),.22),
                lerp(actorPos.y,target.z,.28),
              );
            } else {
              scratchCamera.lookAt.set(pivot.x+f.x*2.5,pivot.y-.08,pivot.z+f.z*2.5);
            }''',
          '''    scratchCamera.lookAt.set(
                lerp(actorPos.x,target.x,.38),
                lerp(THIRD_PERSON_CAMERA.lookHeight,enemyTargetHeight(target),.18),
                lerp(actorPos.y,target.z,.38),
              );
            } else {
              scratchCamera.lookAt.set(
                actorPos.x+f.x*THIRD_PERSON_CAMERA.lookAhead,
                THIRD_PERSON_CAMERA.lookHeight,
                actorPos.y+f.z*THIRD_PERSON_CAMERA.lookAhead,
              );
            }''',
          'lower forward look target')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate camera module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('combat-arena.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script type="module">(.*?)</script>', source, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one module script, found {len(scripts)}')
          required = [
              'fov:54', 'distance:12', 'lockDistance:13',
              'pivotHeight:2.35', 'lookAhead:5', 'lookHeight:1.15',
              'rayHeight<=THIRD_PERSON_CAMERA.wallHeight+.12'
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('Missing camera tuning anchors: ' + ', '.join(missing))
          Path('/tmp/combat-arena.mjs').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/combat-arena.mjs

      - name: Remove one-time workflow
        run: rm .github/workflows/tune-nightreign-camera.yml

      - name: Commit camera pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-arena.html .github/workflows/tune-nightreign-camera.yml
          git commit -m "Pull back and raise third-person camera"
          git push origin HEAD:agent/combat-arena-third-person
