name: Trigger Tartarus rebuild

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebase branch
        uses: actions/checkout@v4
        with:
          ref: agent/tartarus-native-mix-rebase
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply embedded rebuild script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/rebuild-tartarus-on-main.yml').read_text()
          block=workflow.split("python <<'PY'\n",1)[1].split("\n          PY",1)[0]
          block='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(block,'<tartarus-rebuild>','exec'))
          PY
      - name: Validate rebased Tartarus changes
        run: |
          node --check src/arena-enemies-core.js
          node --check src/hades-arena-enemies.js
          node --check src/hades-encounter-director.js
          node --check src/hades-encounter-tuning.js
          npm run test:hades
          npm run test:encounters
      - name: Commit rebased implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/arena-enemies-core.js src/hades-arena-enemies.js src/hades-encounter-director.js src/hades-encounter-tuning.js src/fusion-enemies.js tests/hades-enemies.test.mjs
          git commit -m "Rebase native Tartarus mix onto current main"
          git push origin HEAD:agent/tartarus-native-mix-rebase
