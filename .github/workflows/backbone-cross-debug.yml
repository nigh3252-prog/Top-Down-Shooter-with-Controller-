name: Apply Long Blade parry burst

on:
  pull_request:
    branches:
      - automation/long-blade-parry-burst-base
    types:
      - edited

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.number == 119 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Gate 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stance-2-gate-5-pilot
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and test Long Blade parry
        run: |
          node .parry-burst/apply.mjs
          git diff --check
          node --check src/stance-gate5-defense.js
          node --check src/stance-gate5-visuals.js
          npm run test:combat
      - name: Commit and push tested parry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf .parry-burst
          git rm -f .github/workflows/backbone-cross-debug.yml
          git add src/stance-gate5-defense.js src/stance-gate5-visuals.js docs/design/STANCE_2_GATE_5_PILOT.md tests/long-blade-parry-burst.test.mjs package.json
          git diff --cached --check
          git commit -m "Finish Long Blade parry with simple burst"
          git push origin HEAD:agent/stance-2-gate-5-pilot
