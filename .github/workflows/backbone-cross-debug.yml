name: Apply Backbone Cross priority and diagnostics

on:
  pull_request:
    branches:
      - automation/backbone-cross-debug-base
    types:
      - edited

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.number == 119 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Gate 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stance-2-gate-5-pilot
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply and test Backbone fix
        run: |
          node .cross-debug/apply.mjs
          git diff --check
          node --check src/playstation-backbone-input.js
          node --check src/stance-gate5-defense.js
          npm run test:combat

      - name: Commit and push tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf .cross-debug
          git rm -f .github/workflows/backbone-cross-debug.yml
          git add combat-arena.html enemy-lab.html package.json src/playstation-backbone-input.js src/stance-gate5-defense.js tests
          git diff --cached --check
          git commit -m "Prioritize Backbone Cross defense and expose diagnostics"
          git push origin HEAD:agent/stance-2-gate-5-pilot
