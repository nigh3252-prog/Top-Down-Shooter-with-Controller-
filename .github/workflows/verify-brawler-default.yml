name: Verify brawler default

on:
  push:
    branches:
      - Combo-fix
    paths:
      - .github/workflows/verify-brawler-default.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Combo-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Remove temporary verifier
        run: |
          rm .github/workflows/verify-brawler-default.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-brawler-default.yml
          git commit -m "Remove brawler default verifier"
          git push origin HEAD:Combo-fix
