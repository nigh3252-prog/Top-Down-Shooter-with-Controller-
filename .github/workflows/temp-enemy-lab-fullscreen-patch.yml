name: Temporary Enemy Lab fullscreen patch

on:
  push:
    branches:
      - enemy-lab-fullscreen-button

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enemy-lab-fullscreen-button
      - name: Unhide only the fullscreen button
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('enemy-lab.html')
          text = path.read_text(encoding='utf-8')
          old = "if(topBar)topBar.style.display='none';"
          new = "if(topBar)topBar.style.display='flex';const menuButton=doc.getElementById('menuBtn');if(menuButton)menuButton.style.display='none';"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one fullscreen hiding statement, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/temp-enemy-lab-fullscreen-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enemy-lab.html .github/workflows/temp-enemy-lab-fullscreen-patch.yml
          git commit -m "Show fullscreen button in Enemy Lab"
          git push origin HEAD:enemy-lab-fullscreen-button
