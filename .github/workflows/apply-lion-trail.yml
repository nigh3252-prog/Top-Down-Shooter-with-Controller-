name: Apply lion trail branch patch

on:
  push:
    branches:
      - agent/lion-three-second-trail
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: lion-trail-branch-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply lion trail changes
        run: python tools/apply-lion-trail-branch.py

      - name: Validate branch
        run: npm test

      - name: Commit implementation
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          rm .github/workflows/apply-lion-trail.yml tools/apply-lion-trail-branch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make lion follow player trail"
          git push origin HEAD:"$BRANCH_NAME"
