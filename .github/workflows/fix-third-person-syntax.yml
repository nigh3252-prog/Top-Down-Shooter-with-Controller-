name: Fix third-person combat arena syntax

on:
  push:
    branches:
      - agent/combat-arena-third-person

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/combat-arena-third-person
          fetch-depth: 0

      - name: Fix duplicate function header
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('combat-arena.html')
          source = path.read_text(encoding='utf-8')
          bad = 'function attackCommitWeight(){function attackCommitWeight(){'
          count = source.count(bad)
          if count != 1:
              raise SystemExit(f'Expected one duplicate attackCommitWeight header, found {count}')
          path.write_text(source.replace(bad, 'function attackCommitWeight(){', 1), encoding='utf-8')
          PY

      - name: Validate module JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('combat-arena.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script type="module">(.*?)</script>', source, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one module script, found {len(scripts)}')
          Path('/tmp/combat-arena.mjs').write_text(scripts[0], encoding='utf-8')
          required = ['THIRD_PERSON_CAMERA', 'cameraCollisionT', 'toggleLock', 'id="lockReticle"']
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('Missing third-person features: ' + ', '.join(missing))
          PY
          node --check /tmp/combat-arena.mjs

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/fix-third-person-syntax.yml
          rm -f .github/workflows/validate-third-person-combat-arena.yml

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-arena.html .github/workflows/fix-third-person-syntax.yml .github/workflows/validate-third-person-combat-arena.yml
          git commit -m "Fix third-person camera syntax"
          git push origin HEAD:agent/combat-arena-third-person
