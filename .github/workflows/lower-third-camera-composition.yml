name: Tune lower-third camera composition

on:
  push:
    branches:
      - agent/combat-arena-third-person

permissions:
  contents: write

jobs:
  tune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/combat-arena-third-person
          fetch-depth: 0

      - name: Shift camera composition to lower third
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('combat-arena.html')
          source = path.read_text(encoding='utf-8')
          replacements = {
              'lookAhead:5, lookHeight:1.15, lockRise:.35,':
                  'lookAhead:7, lookHeight:2.05, lockRise:.35,',
              'lerp(actorPos.x,target.x,.38),':
                  'lerp(actorPos.x,target.x,.46),',
              'lerp(THIRD_PERSON_CAMERA.lookHeight,enemyTargetHeight(target),.18),':
                  'lerp(THIRD_PERSON_CAMERA.lookHeight,enemyTargetHeight(target),.28),',
              'lerp(actorPos.y,target.z,.38),':
                  'lerp(actorPos.y,target.z,.46),',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}, found {count}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate module JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('combat-arena.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script type="module">(.*?)</script>', source, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one module script, found {len(scripts)}')
          Path('/tmp/combat-arena.mjs').write_text(scripts[0], encoding='utf-8')
          assert 'lookAhead:7, lookHeight:2.05' in source
          PY
          node --check /tmp/combat-arena.mjs

      - name: Remove one-time workflow
        run: rm .github/workflows/lower-third-camera-composition.yml

      - name: Commit camera composition pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-arena.html .github/workflows/lower-third-camera-composition.yml
          git commit -m "Move combat camera composition to lower third"
          git push origin HEAD:agent/combat-arena-third-person
