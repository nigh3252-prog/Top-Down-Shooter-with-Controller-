name: Fix PR 96 Missing Hades Import

on:
  push:
    branches:
      - "codex/wizard-of-legend-arcana-checklist"
    paths:
      - ".github/workflows/fix-pr96-missing-hades-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/wizard-of-legend-arcana-checklist
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add the missing runtime import
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('src/arena-enemies-core.js')
          text = path.read_text(encoding='utf-8')
          import_line = "import { setHadesNativeModeActive } from './hades-encounter-tuning.js';"
          marker = "import { createCombinedEncounterPlan } from './combined-encounter-director.js';"

          if import_line not in text:
              if marker not in text:
                  raise RuntimeError('Could not locate combined encounter import marker')
              text = text.replace(marker, marker + '\n' + import_line, 1)
              path.write_text(text, encoding='utf-8')

          if text.count(import_line) != 1:
              raise RuntimeError('Expected exactly one Hades native-mode import')
          PY

      - name: Run full test suite
        run: npm test

      - name: Commit the tested fix and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-pr96-missing-hades-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix missing Hades native mode import"
          git push origin HEAD:codex/wizard-of-legend-arcana-checklist
