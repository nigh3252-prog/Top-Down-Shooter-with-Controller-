name: Apply authoritative defense rewrite

on:
  pull_request:
    branches:
      - automation/defense-rewrite-base
    types:
      - edited

permissions:
  contents: write

jobs:
  rewrite-and-test:
    if: github.event.pull_request.number == 119 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Gate 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stance-2-gate-5-pilot
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply coherent rewrite
        run: |
          node .defense-rewrite/apply.mjs
          node .defense-rewrite/fix-test.mjs
          git diff --check
          node --check src/stance-gate5-defense.js
          node --check src/stance-gate5-visuals.js
          node --check src/player-damage-route.js
          node --check src/playstation-backbone-input.js
          npm run test:combat

      - name: Commit and push tested rewrite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf .defense-rewrite
          git rm -f .github/workflows/authoritative-defense-rewrite.yml
          git add combat-arena.html package.json src/arena-enemies-core.js src/weapon-balance.js src/player-damage-route.js src/playstation-backbone-input.js src/stance-gate5-defense.js src/stance-gate5-visuals.js tests
          git diff --cached --check
          git commit -m "Rewrite defense around one authoritative arena state"
          git push origin HEAD:agent/stance-2-gate-5-pilot
