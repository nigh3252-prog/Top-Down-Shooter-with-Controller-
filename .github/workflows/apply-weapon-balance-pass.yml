name: Apply weapon stamina and light cleave balance

on:
  push:
    branches:
      - Combo-fix
    paths:
      - .github/workflows/apply-weapon-balance-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Combo-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch weapon balance
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          balance = """// Shared weapon-class stamina, cleave, and focused rapier tuning rules.\n\nexport const WEAPON_STAMINA_MULTIPLIERS = Object.freeze({\n  Light: 0.5,\n  Medium: 1.0,\n  Heavy: 1.5,\n});\n\nexport const RAPIER_TIP_TUNING = Object.freeze({\n  from: 0.92,\n  to: 1.04,\n  radius: 0.11,\n  damage: 36,\n  stagger: 0.50,\n});\n\nexport function getWeaponStaminaMultiplier(weaponDef) {\n  const staminaClass = weaponDef?.staminaClass;\n  const multiplier = WEAPON_STAMINA_MULTIPLIERS[staminaClass];\n  if (!Number.isFinite(multiplier)) {\n    throw new Error(`[weapon-balance] Missing or invalid staminaClass: ${JSON.stringify(staminaClass)}`);\n  }\n  return multiplier;\n}\n\nexport function staminaCostForWeapon(baseCost, weaponDef) {\n  const base = Number(baseCost);\n  if (!Number.isFinite(base)) throw new Error(`[weapon-balance] Invalid base stamina cost: ${JSON.stringify(baseCost)}`);\n  return base * getWeaponStaminaMultiplier(weaponDef);\n}\n\nexport function weaponAllowsCleave({ weaponDef, attackSlot = -1, maxCharge = false } = {}) {\n  const staminaClass = weaponDef?.staminaClass;\n  if (!WEAPON_STAMINA_MULTIPLIERS[staminaClass]) {\n    throw new Error(`[weapon-balance] Missing or invalid staminaClass: ${JSON.stringify(staminaClass)}`);\n  }\n  if (staminaClass !== 'Light') return true;\n  return attackSlot === 2 && maxCharge === true;\n}\n"""
          Path('src/weapon-balance.js').write_text(balance, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # Explicit three-class weapon definitions.
          path = Path('src/weapons.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("    weightClass: 'Medium',\n    kind: 'blade',", "    weightClass: 'Medium',\n    staminaClass: 'Medium',\n    kind: 'blade',", 'longsword class'),
              ("    weightClass: 'Light',\n    kind: 'blade',", "    weightClass: 'Light',\n    staminaClass: 'Light',\n    kind: 'blade',", 'dagger class'),
              ("    weightClass: 'Light',\n    kind: 'rapier',", "    weightClass: 'Light',\n    staminaClass: 'Light',\n    kind: 'rapier',", 'rapier class'),
              ("    weightClass: 'Light/Medium',\n    kind: 'katana',", "    weightClass: 'Medium',\n    staminaClass: 'Medium',\n    kind: 'katana',", 'katana class'),
              ("    weightClass: 'Light / Reach',\n    kind: 'whip',", "    weightClass: 'Light',\n    staminaClass: 'Light',\n    kind: 'whip',", 'whip class'),
              ("    weightClass: 'Medium',\n    kind: 'mace',", "    weightClass: 'Medium',\n    staminaClass: 'Medium',\n    kind: 'mace',", 'mace class'),
              ("    weightClass: 'Medium / Reach',\n    kind: 'spear',", "    weightClass: 'Medium',\n    staminaClass: 'Medium',\n    kind: 'spear',", 'spear class'),
              ("    weightClass: 'Medium/Heavy',\n    kind: 'axe',", "    weightClass: 'Heavy',\n    staminaClass: 'Heavy',\n    kind: 'axe',", 'battle axe class'),
              ("    weightClass: 'Heavy',\n    kind: 'hammer',", "    weightClass: 'Heavy',\n    staminaClass: 'Heavy',\n    kind: 'hammer',", 'warhammer class'),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          # Two heavy blade definitions appear before greatsword; patch by scoped labels.
          text = replace_once(text,
              "  claymore: {\n    label: 'Claymore',\n    weightClass: 'Heavy',\n    kind: 'blade',",
              "  claymore: {\n    label: 'Claymore',\n    weightClass: 'Heavy',\n    staminaClass: 'Heavy',\n    kind: 'blade',", 'claymore class')
          text = replace_once(text,
              "  greatsword: {\n    label: 'Greatsword',\n    weightClass: 'Heavy',\n    kind: 'blade',",
              "  greatsword: {\n    label: 'Greatsword',\n    weightClass: 'Heavy',\n    staminaClass: 'Heavy',\n    kind: 'blade',", 'greatsword class')
          path.write_text(text, encoding='utf-8')

          # Focused rapier point tuning lives in shared data.
          path = Path('src/player-combat.js')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text,
              "import { shouldStartBufferedFollowup } from './combat-links.js';\n",
              "import { shouldStartBufferedFollowup } from './combat-links.js';\nimport { RAPIER_TIP_TUNING } from './weapon-balance.js';\n", 'player combat balance import')
          text = replace_once(text,
              "    if(kind==='rapier'){\n      add('rapierTip','Rapier tip','pierce',.88,1.06,.15,grp==='stab'?36:14,1.05,0,0,'stab');\n",
              "    if(kind==='rapier'){\n      const tip = RAPIER_TIP_TUNING;\n      add('rapierTip','Rapier tip','pierce',tip.from,tip.to,tip.radius,grp==='stab'?tip.damage:14,tip.stagger,0,0,'stab');\n", 'rapier tip tuning')
          path.write_text(text, encoding='utf-8')

          # Arena stamina and one-target Light weapon behavior.
          path = Path('combat-arena.html')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text,
              "import { getWeaponDamageMultiplier } from './src/combat-balance.js';\n",
              "import { getWeaponDamageMultiplier } from './src/combat-balance.js';\nimport { staminaCostForWeapon, weaponAllowsCleave } from './src/weapon-balance.js';\n", 'arena balance import')
          text = replace_once(text,
              "  swing:  { s:defaultFeel(), dmgMult:1, knockMult:1, stun:.2, lunge:1, staminaSpent:0 },\n",
              "  swing:  { s:defaultFeel(), dmgMult:1, knockMult:1, stun:.2, lunge:1, staminaSpent:0, maxChargeCleave:false },\n", 'swing max charge state')
          text = replace_once(text,
              "function staminaCostForGroup(group){ return STAMINA.costs[group] ?? STAMINA.costs.default; }\n",
              "function staminaCostForGroup(group){\n  const base = STAMINA.costs[group] ?? STAMINA.costs.default;\n  return staminaCostForWeapon(base, PC.currentWeapon());\n}\n", 'weighted stamina function')
          text = replace_once(text,
              "      arena.swing.staminaSpent = spendStamina(staminaCostForGroup(info.group));   // fires exactly once per real swing, combos included\n",
              "      arena.swing.maxChargeCleave = false;\n      combatState.singleTargetEnemy = null;\n      arena.swing.staminaSpent = spendStamina(staminaCostForGroup(info.group));   // fires exactly once per real swing, combos included\n", 'attack start balance reset')
          text = replace_once(text,
              "      arena.swing.staminaSpent = 0;\n",
              "      arena.swing.staminaSpent = 0;\n      arena.swing.maxChargeCleave = false;\n      combatState.singleTargetEnemy = null;\n", 'attack complete balance reset')
          text = replace_once(text,
              "  const chargeFrac = clamp((arena.charge.tier - 1/3) / (2/3), 0, 1);\n  arena.swing.staminaSpent += spendStamina(base * (STAMINA.chargeCostMult - 1) * chargeFrac);\n",
              "  const chargeFrac = clamp((arena.charge.tier - 1/3) / (2/3), 0, 1);\n  arena.swing.maxChargeCleave = chargeFrac >= .999;\n  arena.swing.staminaSpent += spendStamina(base * (STAMINA.chargeCostMult - 1) * chargeFrac);\n", 'max charge cleave unlock')

          start = text.index('function detectEnemyHits(dt, tipScene, baseScene, tipSpeed){')
          end = text.index('function tierOfSwing()', start)
          new_hits = """function detectEnemyHits(dt, tipScene, baseScene, tipSpeed){\n  if(!combatState.attack || !PC.weaponRoot || !enemySystem) return;\n  if(!combatState.hitIds) combatState.hitIds = new Set();\n  const zones = PC.getWeaponHitZones();\n  detectDoorHits(zones);\n  const weaponDef = PC.currentWeapon();\n  const canCleave = weaponAllowsCleave({\n    weaponDef,\n    attackSlot: arena.chain.activeSlot,\n    maxCharge: arena.swing.maxChargeCleave,\n  });\n  const enemies = [...enemySystem.enemies];\n  if(!canCleave){\n    enemies.sort((a,b)=>Math.hypot(a.x-actorPos.x,a.z-actorPos.y)-Math.hypot(b.x-actorPos.x,b.z-actorPos.y));\n  }\n  for(const e of enemies){\n    if(!canCleave && combatState.singleTargetEnemy && combatState.singleTargetEnemy !== e) continue;\n    if(combatState.hitIds.has(e)) continue;\n    const enemyScale = enemySystem.heightScale || 1;\n    const scaledRadius = e.radius * enemyScale * (e.collisionScale || 1);\n    const h = (e.height || e.radius * 2) * enemyScale * (e.currentTargetScale || e.targetScale || 1);\n    const targetOffsetY = e.targetYOffset || 0;\n    const targetOrigins = [{ x:e.x, z:e.z }];\n    if(e.attackOriginForward > 0){\n      targetOrigins.push({\n        x:e.x + e.facing.x * e.attackOriginForward * enemyScale,\n        z:e.z + e.facing.z * e.attackOriginForward * enemyScale\n      });\n    }\n    const hitSamples = targetOrigins.flatMap(origin => [.24, .52, .80].map(k => new THREE.Vector3(origin.x, targetOffsetY + h * k, origin.z)));\n    let best = null;\n    for(const zone of zones){\n      const a = PC.weaponRoot.localToWorld(zone.from.clone());\n      const b = PC.weaponRoot.localToWorld(zone.to.clone());\n      const threshold = scaledRadius + zone.radius + .38;\n      let bestDist = Infinity, bestCenter = hitSamples[1];\n      for(const center of hitSamples){ const d = PC.pointSegmentDistance(center, a, b); if(d < bestDist){ bestDist = d; bestCenter = center; } }\n      if(bestDist <= threshold){\n        if(mazeNavigation.raycastWalls({ x:actorPos.x, z:actorPos.y }, { x:bestCenter.x, z:bestCenter.z })) continue;\n        const quality = 1 - clamp(bestDist / threshold, 0, 1);\n        const weaponMult = getWeaponDamageMultiplier({ weaponId: combatState.weapon, weaponDef, attackKey: combatState.attackKey, attackGroup: combatState.attackGroup, hitType: zone.type, zoneId: zone.id });\n        const raw = zone.damage * (.82 + quality * .42) * weaponMult * arena.swing.dmgMult;\n        const motion = tipScene.clone().sub(baseScene); if(motion.lengthSq() < 1e-6) motion.set(e.x - actorPos.x, 0, e.z - actorPos.y); motion.normalize();\n        const cand = { zone, damage: Math.max(1, Math.round(raw)), point: bestCenter.clone().lerp(tipScene, .25), motion };\n        if(!best || cand.damage > best.damage) best = cand;\n      }\n    }\n    if(best){\n      if(!canCleave) combatState.singleTargetEnemy = e;\n      combatState.hitIds.add(e);\n      const stagger = best.zone.stagger * arena.swing.knockMult * Math.max(0, HitFeel.tuning.knock);\n      const killed = enemySystem.damageEnemy(e, best.damage,\n        { x: best.motion.x * stagger, z: best.motion.z * stagger },\n        { pop: HitFeel.tuning.pop * HitFeel.tuning.master });\n      if(!killed) e.stunned = Math.max(e.stunned, arena.swing.stun);\n      onHitFeel(best.point, arena.charge.active ? arena.charge.tier : tierOfSwing());\n      HitFeel.impact({\n        point: best.point,\n        dir: new THREE.Vector3(best.motion.x, 0, best.motion.z),\n        damage: best.damage, kill: killed,\n        color: HIT_TYPE_COLOR[best.zone.type] || 0xffffff\n      });\n      const recoil = .20 * clamp(best.damage / 28, .4, 2) * HitFeel.tuning.master;\n      actorPos.x -= best.motion.x * recoil;\n      actorPos.y -= best.motion.z * recoil;\n      spawnHitEffect(best.point, best.zone.type, best.damage);\n      CombatAudio.onDummyEvent({ damage: best.damage, kill: killed });\n      if(!canCleave) break;\n    }\n  }\n}\n"""
          text = text[:start] + new_hits + text[end:]
          path.write_text(text, encoding='utf-8')

          # Automated contract checks.
          path = Path('tests/combat-pass.test.mjs')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text,
              "import { WEAPON_AFFINITIES, getWeaponDamageMultiplier } from '../src/combat-balance.js';\n",
              "import { WEAPON_AFFINITIES, getWeaponDamageMultiplier } from '../src/combat-balance.js';\nimport { RAPIER_TIP_TUNING, WEAPON_STAMINA_MULTIPLIERS, getWeaponStaminaMultiplier, staminaCostForWeapon, weaponAllowsCleave } from '../src/weapon-balance.js';\n", 'test balance import')
          marker = "assert(Number.isFinite(getWeaponDamageMultiplier({\n  weaponId:'katana', attackKey:'horizontal4', attackGroup:'horizontal',\n  hitType:'slice', zoneId:'katanaHa'\n})),'katana damage resolves through the normal balance path');\n"
          addition = marker + """\nconst expectedStaminaClasses={\n  longsword:'Medium', dagger:'Light', rapier:'Light', katana:'Medium', whip:'Light',\n  mace:'Medium', spear:'Medium', battleaxe:'Heavy', warhammer:'Heavy', claymore:'Heavy', greatsword:'Heavy'\n};\nfor(const [weaponId,staminaClass] of Object.entries(expectedStaminaClasses)){\n  assert.equal(STONE_WEAPONS[weaponId].staminaClass,staminaClass,`${weaponId} has a definite stamina class`);\n  assert.equal(STONE_WEAPONS[weaponId].weightClass,staminaClass,`${weaponId} displays the same definite weight class`);\n}\nassert.deepEqual(WEAPON_STAMINA_MULTIPLIERS,{Light:.5,Medium:1,Heavy:1.5});\nassert.equal(getWeaponStaminaMultiplier(STONE_WEAPONS.rapier),.5);\nassert.equal(staminaCostForWeapon(18,STONE_WEAPONS.rapier),9);\nassert.equal(staminaCostForWeapon(18,STONE_WEAPONS.longsword),18);\nassert.equal(staminaCostForWeapon(18,STONE_WEAPONS.greatsword),27);\nassert.equal(weaponAllowsCleave({weaponDef:STONE_WEAPONS.rapier,attackSlot:0,maxCharge:false}),false);\nassert.equal(weaponAllowsCleave({weaponDef:STONE_WEAPONS.dagger,attackSlot:2,maxCharge:false}),false);\nassert.equal(weaponAllowsCleave({weaponDef:STONE_WEAPONS.whip,attackSlot:2,maxCharge:true}),true);\nassert.equal(weaponAllowsCleave({weaponDef:STONE_WEAPONS.spear,attackSlot:0,maxCharge:false}),true);\nassert.deepEqual(RAPIER_TIP_TUNING,{from:.92,to:1.04,radius:.11,damage:36,stagger:.5});\n"""
          text = replace_once(text, marker, addition, 'weapon balance tests')
          path.write_text(text, encoding='utf-8')

          # Extract the browser module for syntax validation.
          html = Path('combat-arena.html').read_text(encoding='utf-8')
          script = html.split('<script type="module">', 1)[1].split('</script>', 1)[0]
          Path('/tmp/combat-arena.mjs').write_text(script, encoding='utf-8')
          PY

          node --check src/weapon-balance.js
          node --check src/weapons.js
          node --check src/player-combat.js
          node --check /tmp/combat-arena.mjs
          npm test

          rm .github/workflows/apply-weapon-balance-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/weapon-balance.js src/weapons.js src/player-combat.js combat-arena.html tests/combat-pass.test.mjs .github/workflows/apply-weapon-balance-pass.yml
          git commit -m "Balance weapon stamina and light cleave"
          git push origin HEAD:Combo-fix
