name: Apply Hammerfall shield input and presentation fix

on:
  pull_request:
    branches:
      - automation/hammerfall-shield-presentation-base
    types:
      - edited

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.number == 119 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Gate 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stance-2-gate-5-pilot
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply and test Hammerfall shield fix
        shell: bash
        run: |
          node .hammerfall-shield-fix/apply.mjs
          git diff --check
          node tests/hammerfall-shield-presentation.test.mjs
          npm run test:combat

      - name: Commit and push tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .hammerfall-shield-fix .github/workflows/hammerfall-shield-presentation.yml
          git add combat-arena.html src/stance-gate5-visuals.js tests/hammerfall-shield-presentation.test.mjs package.json
          git diff --cached --check
          git commit -m "Fix Hammerfall shield controls and alignment"
          git push origin HEAD:agent/stance-2-gate-5-pilot
