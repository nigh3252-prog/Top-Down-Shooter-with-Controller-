name: Append Wizard Arcana Reference

on:
  push:
    branches:
      - "docs/wizard-of-legend-spell-language"
    paths:
      - ".github/workflows/append-wol-arcana.yml"

permissions:
  contents: write

jobs:
  append-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/wizard-of-legend-spell-language

      - name: Append analyses and add index
        run: |
          python <<'PY'
          from pathlib import Path

          target = Path("docs/wizard_of_legend_arcana_source_reference.md")
          staging = Path(".tmp-wol-append")
          text = target.read_text(encoding="utf-8")

          if "## Ability index" not in text:
              index = (staging / "00-index.md").read_text(encoding="utf-8").rstrip()
              marker = "\n---\n"
              position = text.find(marker)
              if position < 0:
                  raise RuntimeError("Could not find introduction separator for the ability index")
              text = text[:position + 1] + "\n" + index + "\n\n" + text[position + 1:]

          if "# 14. Rip Tide" not in text:
              parts = []
              for source in sorted(staging.glob("[0-9][0-9]-*.md")):
                  if source.name.startswith("00-"):
                      continue
                  parts.append(source.read_text(encoding="utf-8").strip())
              text = text.rstrip() + "\n\n" + "\n\n".join(parts) + "\n"

          target.write_text(text, encoding="utf-8")
          PY

      - name: Commit final reference and remove staging files
        run: |
          rm -rf .tmp-wol-append
          rm -f .github/workflows/append-wol-arcana.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Append five Wizard of Legend source analyses"
          git push origin HEAD:docs/wizard-of-legend-spell-language
