name: Temporary validate deckbuilder arcade v3

on:
  push:
    branches:
      - agent/realtime-deckbuilder-arcade

permissions:
  contents: write

jobs:
  validate_v3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/realtime-deckbuilder-arcade

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build v3
        run: python3 .github/scripts/build_realtime_deckbuilder_v3.py

      - name: Syntax check
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('tools/realtime-deckbuilder-microgame-arcade-v3.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/i);
          if(!m) throw new Error('script missing');
          fs.writeFileSync('/tmp/arcade-v3.js',m[1]);
          NODE
          node --check /tmp/arcade-v3.js

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test reward shrine flow on phone viewport
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:8765/tools/realtime-deckbuilder-microgame-arcade-v3.html >/dev/null && break
            sleep 0.25
          done
          cat >qa-v3.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          const url='http://127.0.0.1:8765/tools/realtime-deckbuilder-microgame-arcade-v3.html';
          await page.goto(url);
          if(await page.locator('.game-tile').count()!==20)throw new Error('Expected 20 games');
          await page.locator('.game-tile').first().click();
          await page.locator('[data-modal-action="start"]').click();
          await page.waitForTimeout(250);
          await page.evaluate(()=>{S.enemies=[];S.elapsed=S.rewardTimes[0]+.05;});
          await page.waitForTimeout(250);
          const shrine=await page.evaluate(()=>!!S.rewardPedestal);
          if(!shrine)throw new Error('Reward shrine did not appear after wave clear');
          const popupBefore=await page.locator('#modalOverlay.show').count();
          if(popupBefore)throw new Error('Reward popup opened automatically');
          await page.evaluate(()=>{S.player.x=S.rewardPedestal.x;S.player.y=S.rewardPedestal.y;renderUI(true);});
          await page.locator('[data-action="__reward"]').click();
          await page.locator('.reward-card').first().click();
          await page.waitForTimeout(850);
          const state=await page.evaluate(()=>({wave:S.wave,pending:S.rewardPending,pedestal:!!S.rewardPedestal,paused:S.paused}));
          if(state.wave!==2||state.pending||state.pedestal||state.paused)throw new Error(`Bad post-reward state ${JSON.stringify(state)}`);
          if(errors.length)throw new Error(errors.join('\n'));
          await browser.close();
          console.log('Reward shrine flow passed at 390x844.');
          NODE
          node qa-v3.mjs

      - name: Commit v3 and remove temporary validation files
        run: |
          rm .github/workflows/temporary-validate-deckbuilder-v3.yml
          rm .github/scripts/build_realtime_deckbuilder_v3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/realtime-deckbuilder-microgame-arcade-v3.html .github/workflows/temporary-validate-deckbuilder-v3.yml .github/scripts/build_realtime_deckbuilder_v3.py
          git commit -m "Add intentional wave reward shrine flow"
          git push origin HEAD:agent/realtime-deckbuilder-arcade
