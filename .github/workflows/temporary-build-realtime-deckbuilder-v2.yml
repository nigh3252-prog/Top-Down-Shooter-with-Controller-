name: Temporary build real-time deckbuilder arcade v2

on:
  push:
    branches:
      - agent/realtime-deckbuilder-arcade

permissions:
  contents: write

jobs:
  build_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/realtime-deckbuilder-arcade

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build v2
        run: python3 .github/scripts/build_realtime_deckbuilder_v2.py

      - name: Syntax check embedded JavaScript
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('tools/realtime-deckbuilder-microgame-arcade-v2.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/i);if(!m)throw new Error('script missing');fs.writeFileSync('/tmp/arcade-v2.js',m[1]);"
          node --check /tmp/arcade-v2.js

      - name: Commit v2 and remove temporary builder
        run: |
          rm .github/workflows/temporary-build-realtime-deckbuilder-v2.yml
          rm .github/scripts/build_realtime_deckbuilder_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/realtime-deckbuilder-microgame-arcade-v2.html .github/workflows/temporary-build-realtime-deckbuilder-v2.yml .github/scripts/build_realtime_deckbuilder_v2.py
          git commit -m "Add floating controls and scroll-safe menu to deckbuilder arcade"
          git push origin HEAD:agent/realtime-deckbuilder-arcade
