function save(){localStorage.setItem(storeKey,JSON.stringify({...state,capture:captureState}));dispatchEvent(new CustomEvent('enemy-lab:workspace-change'));}function setMessage(text=''){message.textContent=text;}function snapshot(){return controlBridge()?.snapshot?.()||{ready:false,roomOptions:[],controlGroups:[]};}
function compatible(a,b){if(!a||!b||a.id===b.id||a.system===b.system)return false;if((a.tags.includes('area-denial')&&b.tags.includes('hard-control'))||(b.tags.includes('area-denial')&&a.tags.includes('hard-control')))return false;if(a.avoidTags.some(tag=>b.tags.includes(tag))||b.avoidTags.some(tag=>a.tags.includes(tag)))return false;return true;}
