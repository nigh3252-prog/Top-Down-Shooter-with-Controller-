<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Enemy Lab</title>
<style>
:root{color-scheme:dark;--bg:#071113;--panel:rgba(7,19,21,.985);--panel2:#102628;--line:#31504d;--text:#d9eee9;--muted:#7ea39d;--gold:#e8a04c;--red:#d96d4a;--teal:#7bcabd}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text);touch-action:none}
button,select,input{font:inherit}
#arenaFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0d191b;visibility:hidden;opacity:0;transition:opacity .12s ease}
#arenaFrame.ready{visibility:visible;opacity:1}
#labHud{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:80;display:flex;align-items:center;gap:7px;pointer-events:none;transition:opacity .15s}
body.dockOpen #labHud{opacity:0}
body.cleanCapture #labHud,body.cleanCapture #labDock,body.cleanCapture #veil,body.cleanCapture #result{display:none!important}
#testBadge{max-width:min(54vw,360px);padding:8px 10px;border:1px solid rgba(49,80,77,.85);border-radius:7px;background:rgba(8,20,22,.84);font-size:10px;line-height:1.2;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#testBadge strong{color:var(--gold)}
.uiBtn,.choice,.miniBtn{color:var(--text);background:rgba(16,38,40,.95);border:1px solid var(--line);border-radius:8px;touch-action:manipulation}
.uiBtn{min-height:38px;padding:0 13px;color:var(--gold);font-size:11px;letter-spacing:.12em;pointer-events:auto;box-shadow:0 3px 0 rgba(0,0,0,.35)}
button:active{transform:translateY(1px);background:#264542}
#veil{position:fixed;inset:0;z-index:87;background:rgba(0,0,0,.08);opacity:0;pointer-events:none;transition:opacity .16s}
#veil.on{opacity:1;pointer-events:auto}
#labDock{position:fixed;z-index:90;background:linear-gradient(180deg,rgba(8,22,24,.99),rgba(4,13,15,.99));border:1px solid #40645f;box-shadow:0 12px 55px rgba(0,0,0,.5);overflow:hidden;transition:transform .2s ease-out;display:grid}
#dockHead{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid rgba(49,80,77,.7)}
#dockTitle{flex:1;min-width:0}#dockTitle b{display:block;color:var(--gold);font-size:13px;letter-spacing:.15em}#dockTitle span{display:block;color:var(--muted);font-size:8.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#closeBtn{width:38px;height:38px;padding:0;font-size:18px}
#labCategories,#labValues{scrollbar-width:none;overscroll-behavior:contain}#labCategories::-webkit-scrollbar,#labValues::-webkit-scrollbar{display:none}
#labCategories{display:flex;gap:6px;padding:8px;background:rgba(0,0,0,.14)}
#labCategories .choice{justify-content:center;text-align:center}
#labCategories .choice b{font-size:9px;letter-spacing:.08em}
#labCategories .choice span,#labCategories .choice em{display:none}
#labCategories .choice.testCategory{color:#172321;border-color:#ffd092;background:linear-gradient(145deg,#f1ad50,#d67a3f);box-shadow:inset 0 0 0 1px rgba(255,224,172,.42),0 2px 9px rgba(232,160,76,.18)}
#labCategories .choice.testCategory.on{color:#10201d;border-color:#fff0cf;box-shadow:inset 0 0 0 2px rgba(255,244,214,.72),0 0 15px rgba(232,160,76,.34)}
#labCategories .choice.systemCategory{border-color:#467a74;color:#a9ddd3;background:rgba(53,101,95,.22)}
#labCategories .choice.systemCategory.on{border-color:#8edbc9;color:#d9fff5;background:rgba(72,139,130,.34)}
#labCategories .choice.captureCategory{border-color:#d67742;color:#ffc58e;background:rgba(119,52,24,.26)}
#labCategories .choice.captureCategory.on{border-color:#ffd3a8;color:#fff2df;background:rgba(182,77,31,.42);box-shadow:inset 0 0 0 1px rgba(255,206,155,.24)}
#labValues{padding:8px;min-width:0;min-height:0}
.valueList{display:flex;gap:7px}
.choice{flex:0 0 auto;min-width:0;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px}
.choice b{font-size:10.5px;line-height:1.2}.choice span{font-size:8px;line-height:1.35;color:var(--muted)}.choice em{font-style:normal;font-size:7.5px;color:#aa7860;margin-top:auto}
.choice.on{border-color:var(--gold);background:rgba(232,160,76,.12);box-shadow:inset 0 0 0 1px rgba(232,160,76,.18)}
.choice.primary{color:#102020;background:var(--gold);border-color:#f2bd78}.choice.primary span,.choice.primary em{color:#243332}.choice.danger{border-color:#75402e;color:#ffad91}.choice.toggle.on{border-color:var(--gold)}
.controlCard,.sliderCard,.statusCard,.sectionCard{border:1px solid rgba(49,80,77,.72);border-radius:8px;background:rgba(16,38,40,.58);padding:10px;flex:0 0 auto}
.statusCard b,.sectionCard b{display:block;color:var(--gold);font-size:11px;margin-bottom:5px}.statusCard span,.sectionCard span{font-size:8.5px;line-height:1.5;color:var(--muted)}
.sectionCard{border-color:rgba(69,111,106,.78);background:rgba(9,28,29,.84)}.sectionCard b{color:var(--teal);letter-spacing:.12em}
.controlCard{display:grid;gap:8px}.row{display:flex;align-items:center;gap:7px}.row label{flex:1;color:var(--muted);font-size:8.5px;letter-spacing:.07em}.value{min-width:45px;text-align:center;color:var(--gold);font-weight:800;font-size:11px}
.miniBtn{min-height:36px;padding:0 10px;font-size:9px;letter-spacing:.06em}.miniBtn.on{color:var(--gold);border-color:#8a5630}.stepper{display:flex;align-items:center;gap:6px}.stepper .miniBtn{width:38px;padding:0;font-size:17px}
.sliderCard label{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:8.5px;letter-spacing:.05em}.sliderCard output{color:var(--gold)}.sliderCard input{width:100%;height:34px;margin-top:6px;accent-color:var(--gold);touch-action:pan-x}
select,.textInput{width:100%;min-height:39px;border:1px solid var(--line);border-radius:7px;background:#102628;color:var(--gold);padding:7px}
#message{min-height:22px;padding:4px 8px;color:#ff987a;font-size:8.5px;text-align:center;border-top:1px solid rgba(49,80,77,.4)}
#valueScrollGutter{position:relative;overflow:hidden;background:rgba(0,0,0,.2);touch-action:none;user-select:none;-webkit-user-select:none}
#valueScrollGutter::before{content:"DRAG";position:absolute;color:#6f918c;font-size:7px;letter-spacing:.12em;pointer-events:none}
#valueScrollThumb{position:absolute;border-radius:10px;background:#8a5630;box-shadow:0 0 0 1px rgba(232,160,76,.25);pointer-events:none;transition:opacity .12s}#valueScrollGutter.disabled #valueScrollThumb{opacity:.22}
#result{position:fixed;left:50%;top:20%;z-index:84;transform:translate(-50%,-12px);opacity:0;pointer-events:none;transition:.18s;padding:12px 15px;border:1px solid #8a5630;border-radius:9px;background:rgba(8,20,22,.94);text-align:center;box-shadow:0 8px 35px #0008}
#result.on{opacity:1;transform:translate(-50%,0)}#result b{display:block;color:var(--gold);font-size:12px;letter-spacing:.12em}#result span{display:block;margin-top:4px;color:var(--muted);font-size:9px}
@media (orientation:landscape){
  #labDock{top:0;right:0;bottom:0;width:min(48vw,560px);border-radius:14px 0 0 14px;border-right:0;grid-template-columns:minmax(230px,1fr) 30px 92px;grid-template-rows:auto 1fr auto;transform:translateX(calc(100% + 24px));padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  #labDock.on{transform:translateX(0)}#dockHead{grid-column:1/4;grid-row:1}#labValues{grid-column:1;grid-row:2;overflow-y:auto;touch-action:pan-y}#valueScrollGutter{grid-column:2;grid-row:2;border-left:1px solid rgba(49,80,77,.55);border-right:1px solid rgba(49,80,77,.55)}#valueScrollGutter::before{left:50%;bottom:10px;transform:translateX(-50%) rotate(-90deg);transform-origin:center}#valueScrollThumb{left:9px;right:9px;top:0;min-height:38px}#labCategories{grid-column:3;grid-row:2;flex-direction:column;overflow-y:auto;touch-action:pan-y}#message{grid-column:1/4;grid-row:3}
  .valueList{flex-direction:column}.choice{width:100%;min-height:66px}.controlCard,.sliderCard,.statusCard,.sectionCard{width:100%}#labCategories .choice{width:100%;min-height:44px;padding:7px}
}
@media (orientation:portrait){
  #labDock{left:0;right:0;bottom:0;height:min(56dvh,560px);border-radius:16px 16px 0 0;grid-template-columns:1fr;grid-template-rows:auto 1fr 28px 58px auto;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom)}
  #labDock.on{transform:translateY(0)}#dockHead{grid-row:1}#labValues{grid-row:2;overflow-x:auto;touch-action:pan-x}#valueScrollGutter{grid-row:3;border-top:1px solid rgba(49,80,77,.55);border-bottom:1px solid rgba(49,80,77,.55)}#valueScrollGutter::before{right:9px;top:50%;transform:translateY(-50%)}#valueScrollThumb{top:9px;bottom:9px;left:0;min-width:42px}#labCategories{grid-row:4;overflow-x:auto;touch-action:pan-x}#message{grid-row:5}
  .valueList{flex-direction:row;height:100%}.choice{width:160px;min-height:92px}.controlCard,.sliderCard,.statusCard,.sectionCard{width:220px;max-height:100%;overflow-y:auto}#labCategories .choice{width:auto;min-width:82px;min-height:42px;padding:6px 9px}#labHud{top:max(6px,env(safe-area-inset-top));right:max(6px,env(safe-area-inset-right))}#testBadge{max-width:58vw}
}
</style>
</head>
<body>
<iframe id="arenaFrame" title="Enemy Lab combat chamber"></iframe>
<script>
(()=>{
  const outer=new URLSearchParams(location.search),inner=new URLSearchParams({seed:'enemy-lab-001',layout:'arena',enemyLab:'1'});
  if(outer.get('capture')==='1'){
    inner.set('capture','1');
    for(const key of['arcana','aim','rngSeed','clean','stage','effects','renderMode'])if(outer.has(key))inner.set(key,outer.get(key));
    if(outer.has('layout'))inner.set('captureLayout',outer.get('layout'));
  }
  document.getElementById('arenaFrame').src=`combat-arena.html?${inner}`;
})();
</script>
<div id="labHud"><div id="testBadge"><strong>ENEMY LAB</strong> · loading chamber</div><button class="uiBtn" id="labBtn">LAB</button></div>
<div id="result"><b>TEST CLEAR</b><span></span></div><div id="veil"></div>
<aside id="labDock" aria-label="Enemy Lab controls">
  <div id="dockHead"><div id="dockTitle"><b>ENEMY LAB</b><span id="categoryHint">Configure and run an enemy test.</span></div><button class="uiBtn" id="closeBtn" aria-label="Close Enemy Lab">×</button></div>
  <section id="labValues"></section>
  <div id="valueScrollGutter" role="scrollbar" aria-label="Drag to scroll options" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="valueScrollThumb"></div></div>
  <nav id="labCategories"></nav><div id="message"></div>
</aside>
<script type="module">
import { gameContent } from './src/game-content.js';
import { installEnemyLabDevelopmentTools } from './src/install-enemy-lab-development-tools.js';
import { ABILITY_CAPTURE_CARD_SUMMARIES, ABILITY_CAPTURE_CHECKPOINTS, normalizeCaptureArcanaId, normalizeCaptureAim, normalizeCaptureDummy } from './src/ability-capture.js';

const $=id=>document.getElementById(id);
const frame=$('arenaFrame'),dock=$('labDock'),veil=$('veil'),values=$('labValues'),categoriesEl=$('labCategories');
const scrollGutter=$('valueScrollGutter'),scrollThumb=$('valueScrollThumb');
const testBadge=$('testBadge'),message=$('message'),result=$('result'),categoryHint=$('categoryHint');
const pageParams=new URLSearchParams(location.search),capturePage=pageParams.get('capture')==='1',cleanCapture=capturePage&&pageParams.get('clean')==='1';
if(!capturePage)installEnemyLabDevelopmentTools();
document.body.classList.toggle('cleanCapture',cleanCapture);
const storeKey='enemyLab.settings.v3';
const saved=(()=>{try{return JSON.parse(localStorage.getItem(storeKey)||localStorage.getItem('enemyLab.settings.v2')||localStorage.getItem('enemyLab.settings.v1')||'{}')}catch{return{}}})();
const catalog=gameContent.enemies.list();
const familyOrder=[...new Set(catalog.map(enemy=>enemy.family))];
const fixedCategories=[['test','TEST','Start, clear, or repeat the configured test.','testCategory'],['capture','ARCANA CAPTURE','Directly cast Wizard Arcana in a deterministic fixed-step chamber.','captureCategory'],['type','TYPE','Choose the enemy family.',''],['enemy','ENEMY','Choose the exact focal enemy.',''],['spawn','SPAWN','Configure solo, pack, or paired-wave spawning.',''],['room','ROOM','Configure the test chamber.','']];
const legacyCategoryMap={player:'controls:panel-loadout',combat:'controls:panel-combatTiming',director:'controls:panel-director',tuning:'controls:panel-sim',feel:'controls:panel-keyframe'};
const restoredCategory=legacyCategoryMap[saved.category]||saved.category||'test';
let state={category:capturePage?'capture':(restoredCategory==='capture'?'test':restoredCategory),family:familyOrder.includes(saved.family)?saved.family:'GOBLINS',enemyId:catalog.some(enemy=>enemy.id===saved.enemyId)?saved.enemyId:'grunt',mode:['solo','pack','wave'].includes(saved.mode)?saved.mode:'solo',packCount:Number(saved.packCount)||3,threat:['low','standard','high'].includes(saved.threat)?saved.threat:'standard',partnerId:saved.partnerId||''};
const initialCaptureStage=String(pageParams.get('stage')||'motion').toLowerCase();
const captureState={arcanaId:normalizeCaptureArcanaId(pageParams.get('arcana')||'DRAGON-ARC'),aim:normalizeCaptureAim(pageParams.get('aim')||'right').id,dummy:normalizeCaptureDummy(pageParams.get('layout')||'none').layout,rngSeed:pageParams.get('rngSeed')||4401,stage:initialCaptureStage,effects:pageParams.has('effects')?!['0','false','off'].includes(String(pageParams.get('effects')).toLowerCase()):!['motion','contract'].includes(initialCaptureStage),renderMode:pageParams.get('renderMode')||(['motion','contract'].includes(initialCaptureStage)?'proxy':'style')};
let dockOpen=false,lastPlan=null,running=false,sawEnemy=false,testStart=0,startHp=100,resultTimer=0,partnerCycle=0,controlsRefreshQueued=false;
const currentEnemy=()=>catalog.find(enemy=>enemy.id===state.enemyId)||catalog[0],enemyBridge=()=>frame.contentWindow?.__enemyLabEnemySystem||null,controlBridge=()=>frame.contentWindow?.__enemyLabControlBridge||null,captureBridge=()=>frame.contentWindow?.__abilityCapture||null,frameDoc=()=>frame.contentDocument||null;
const captureFacade=window.__abilityCapture={
  ready:()=>captureBridge()?.ready?.()===true,
  reset:options=>captureBridge()?.reset?.(options)??{ok:false,error:'Arcana Capture is still loading.'},
  cast:id=>captureBridge()?.cast?.(id)??{ok:false,error:'Arcana Capture is still loading.'},
  step:(frames=1,dt=1/60)=>captureBridge()?.step?.(frames,dt)??{ok:false,error:'Arcana Capture is still loading.'},
  setAim:aim=>captureBridge()?.setAim?.(aim)??{ok:false,error:'Arcana Capture is still loading.'},
  perform:action=>captureBridge()?.perform?.(action)??{ok:false,error:'Arcana Capture is still loading.'},
  act:action=>(captureBridge()?.act||captureBridge()?.perform)?.call(captureBridge(),action)??{ok:false,error:'Arcana Capture is still loading.'},
  snapshot:()=>captureBridge()?.snapshot?.()??{enabled:capturePage,ready:false,paused:true,time:0,frame:0,activeEffects:[],projectiles:[]},
  setPaused:paused=>captureBridge()?.setPaused?.(paused)??{ok:false,error:'Arcana Capture is still loading.'},
  checkpoint:seconds=>captureBridge()?.checkpoint?.(seconds)??{ok:false,error:'Arcana Capture is still loading.'},
  catalog:ABILITY_CAPTURE_CARD_SUMMARIES,checkpoints:ABILITY_CAPTURE_CHECKPOINTS,
};
function tagCaptureCategory(){for(const button of categoriesEl.querySelectorAll('.choice'))if(button.textContent.trim()==='ARCANA CAPTURE'){button.dataset.testid='arcana-capture-category';button.dataset.arcanaCaptureCategory='1';}}
new MutationObserver(tagCaptureCategory).observe(categoriesEl,{childList:true,subtree:true});
categoriesEl.addEventListener('click',event=>{
  const button=event.target.closest?.('.choice');if(!button)return;
  const label=button.querySelector('b')?.textContent?.trim()||button.textContent.trim(),openingCapture=label==='ARCANA CAPTURE';
  if(openingCapture&&!capturePage){
    event.preventDefault();event.stopImmediatePropagation();
    const next=new URL(location.href);next.searchParams.set('capture','1');next.searchParams.set('arcana',captureState.arcanaId);next.searchParams.set('aim',captureState.aim);next.searchParams.set('layout',captureState.dummy);next.searchParams.set('rngSeed',captureState.rngSeed);next.searchParams.set('stage',captureState.stage);next.searchParams.set('effects',captureState.effects?'1':'0');next.searchParams.set('renderMode',captureState.renderMode);location.assign(next);return;
  }
  if(capturePage&&!openingCapture){
    event.preventDefault();event.stopImmediatePropagation();const def=categoryDefs().find(item=>item[1]===label);state.category=def?.[0]||'test';save();
    const next=new URL(location.href);for(const key of['capture','arcana','aim','layout','rngSeed','clean','stage','effects','renderMode'])next.searchParams.delete(key);location.assign(next);
  }
},true);
function capturePayload(){const aim=normalizeCaptureAim(captureState.aim);return{arcanaId:captureState.arcanaId,player:{x:0,z:0,aimX:aim.x,aimZ:aim.z},camera:{mode:'capture'},rngSeed:captureState.rngSeed,dummy:{layout:captureState.dummy},fixtures:{targets:[],hostileProjectiles:[],walls:[]},stage:captureState.stage,effects:captureState.effects,renderMode:captureState.renderMode};}
function updateCaptureBadge(snapshot=captureFacade.snapshot()){const card=ABILITY_CAPTURE_CARD_SUMMARIES.find(item=>item.id===captureState.arcanaId);testBadge.innerHTML=`<strong>${card?.name?.toUpperCase()||captureState.arcanaId}</strong> · ${Number(snapshot.time||0).toFixed(2)}s · ${snapshot.projectiles?.length||0} carriers`;}
function refreshCaptureReadout(snapshot=captureFacade.snapshot()){
  updateCaptureBadge(snapshot);
  const statusCard=values.querySelector('[data-testid="arcana-capture-status"]');if(statusCard){const title=statusCard.querySelector('b'),detail=statusCard.querySelector('span');if(title)title.textContent=snapshot.ready?'CAPTURE READY':'CAPTURE LOADING';if(detail)detail.textContent=snapshot.ready?`Frame ${snapshot.frame} · ${Number(snapshot.time||0).toFixed(3)} seconds · fixed 60 FPS · ${snapshot.projectiles?.length||0} projectile metrics · ${snapshot.stage||captureState.stage} · FX ${snapshot.effects?'ON':'OFF'}`:'The deterministic arena hook will appear when the chamber finishes loading.';}
  const pauseButton=values.querySelector('[data-testid="arcana-capture-pause"]');if(pauseButton){const title=pauseButton.querySelector('b'),detail=pauseButton.querySelector('span');if(title)title.textContent=snapshot.paused?'PLAY':'PAUSE';if(detail)detail.textContent=snapshot.paused?'Advance at wall-clock 60 FPS with exact fixed simulation steps':'Freeze on the current frame';}
  return snapshot;
}
function pollCaptureReadout(){if(capturePage&&captureFacade.ready())refreshCaptureReadout();requestAnimationFrame(pollCaptureReadout);}
if(capturePage)requestAnimationFrame(pollCaptureReadout);
function callCapture(action,...args){if(!captureFacade.ready()){setMessage('Arcana Capture is still loading.');return null;}setMessage('');const result=captureFacade[action]?.(...args);refreshCaptureReadout(result);return result;}
function renderCapture(){
  const current=captureFacade.snapshot(),nodes=[];
  const picker=document.createElement('div');picker.className='controlCard';picker.dataset.testid='arcana-capture-picker';
  const pickerLabel=document.createElement('label');pickerLabel.textContent='WIZARD ARCANA';pickerLabel.style.cssText='font-size:8.5px;color:var(--muted);letter-spacing:.07em';
  const select=document.createElement('select');select.dataset.testid='arcana-capture-select';select.setAttribute('aria-label','Arcana capture ability');
  for(const card of ABILITY_CAPTURE_CARD_SUMMARIES){const option=document.createElement('option');option.value=card.id;option.textContent=`${card.element} · ${card.name}`;option.selected=card.id===captureState.arcanaId;select.appendChild(option);}
  select.addEventListener('change',()=>{captureState.arcanaId=normalizeCaptureArcanaId(select.value);callCapture('reset',capturePayload());renderValues({preserveScroll:true});});picker.append(pickerLabel,select);nodes.push(picker);
  const stageCard=document.createElement('div');stageCard.className='controlCard';stageCard.dataset.testid='arcana-capture-stage';stageCard.innerHTML='<label style="font-size:8.5px;color:var(--muted);letter-spacing:.07em">CAPTURE STAGE</label>';
  const stageRow=document.createElement('div');stageRow.className='row';
  for(const [id,labelText,effects,renderMode] of[['contract','CONTRACT · PROXY',false,'proxy'],['source','SOURCE · FX ON',true,'source'],['style','STYLE · FX ON',true,'style'],['motion','DRAGON MOTION',false,'proxy']]){const button=document.createElement('button');button.className=`miniBtn${captureState.stage===id?' on':''}`;button.textContent=labelText;button.dataset.stage=id;button.dataset.testid=`arcana-capture-stage-${id}`;button.addEventListener('click',()=>{captureState.stage=id;captureState.effects=effects;captureState.renderMode=renderMode;callCapture('reset',capturePayload());renderValues({preserveScroll:true});});stageRow.appendChild(button);}stageCard.appendChild(stageRow);nodes.push(stageCard);
  const controls=[
    ['RESET','Return to frame zero','reset',()=>callCapture('reset',capturePayload())],
    ['CAST','Cast directly without changing the saved deck','cast',()=>callCapture('cast',captureState.arcanaId)],
    [current.paused?'PLAY':'PAUSE',current.paused?'Advance at fixed 60 FPS':'Freeze on the current frame','pause',()=>callCapture('setPaused',!captureFacade.snapshot().paused)],
    ['STEP','Advance exactly one 1/60-second frame','step',()=>callCapture('step',1,1/60)],
  ];
  for(const [labelText,sub,testId,onClick] of controls){const button=choice({label:labelText,sub,className:labelText==='CAST'?'primary':'',onClick:()=>{onClick();renderValues({preserveScroll:true});}});button.dataset.testid=`arcana-capture-${testId}`;nodes.push(button);}
  const aimCard=document.createElement('div');aimCard.className='controlCard';aimCard.dataset.testid='arcana-capture-aim';aimCard.innerHTML='<label style="font-size:8.5px;color:var(--muted);letter-spacing:.07em">FIXED AIM</label>';
  const aimRow=document.createElement('div');aimRow.className='row';
  for(const id of['right','down','left','up']){const button=document.createElement('button');button.className=`miniBtn${captureState.aim===id?' on':''}`;button.textContent=id.toUpperCase();button.dataset.aim=id;button.dataset.testid=`arcana-capture-aim-${id}`;button.addEventListener('click',()=>{captureState.aim=id;callCapture('reset',capturePayload());renderValues({preserveScroll:true});});aimRow.appendChild(button);}aimCard.appendChild(aimRow);nodes.push(aimCard);
  const layoutCard=document.createElement('div');layoutCard.className='controlCard';layoutCard.dataset.testid='arcana-capture-layout';layoutCard.innerHTML='<label style="font-size:8.5px;color:var(--muted);letter-spacing:.07em">DUMMY LAYOUT</label>';
  const layoutRow=document.createElement('div');layoutRow.className='row';
  for(const [id,labelText] of[['none','EMPTY'],['stationary','STATIONARY'],['source-line','SOURCE LINE']]){const button=document.createElement('button');button.className=`miniBtn${captureState.dummy===id?' on':''}`;button.textContent=labelText;button.dataset.layout=id;button.dataset.testid=`arcana-capture-layout-${id}`;button.addEventListener('click',()=>{captureState.dummy=id;callCapture('reset',capturePayload());renderValues({preserveScroll:true});});layoutRow.appendChild(button);}layoutCard.appendChild(layoutRow);nodes.push(layoutCard);
  const checkpointCard=document.createElement('div');checkpointCard.className='controlCard';checkpointCard.dataset.testid='arcana-capture-checkpoints';checkpointCard.innerHTML='<label style="font-size:8.5px;color:var(--muted);letter-spacing:.07em">CANONICAL CHECKPOINT</label>';
  const checkpointRow=document.createElement('div');checkpointRow.className='row';
  for(const seconds of ABILITY_CAPTURE_CHECKPOINTS){const button=document.createElement('button');button.className='miniBtn';button.textContent=`${seconds.toFixed(2)}s`;button.dataset.seconds=String(seconds);button.dataset.testid=`arcana-capture-checkpoint-${seconds}`;button.addEventListener('click',()=>{callCapture('checkpoint',seconds);renderValues({preserveScroll:true});});checkpointRow.appendChild(button);}checkpointCard.appendChild(checkpointRow);nodes.push(checkpointCard);
  const captureStatus=status(current.ready?'CAPTURE READY':'CAPTURE LOADING',current.ready?`Frame ${current.frame} · ${Number(current.time||0).toFixed(3)} seconds · fixed 60 FPS · ${current.projectiles?.length||0} projectile metrics · ${current.stage||captureState.stage} · FX ${current.effects?'ON':'OFF'}`:'The deterministic arena hook will appear when the chamber finishes loading.');captureStatus.dataset.testid='arcana-capture-status';nodes.push(captureStatus);

}
function save(){localStorage.setItem(storeKey,JSON.stringify(state));}function setMessage(text=''){message.textContent=text;}function cleanText(text=''){return String(text).replace(/[▸▾]/g,'').replace(/\s+/g,' ').trim();}function snapshot(){return controlBridge()?.snapshot?.()||{ready:false,roomOptions:[],controlGroups:[]};}
function compatible(a,b){if(!a||!b||a.id===b.id||a.system===b.system)return false;if((a.tags.includes('area-denial')&&b.tags.includes('hard-control'))||(b.tags.includes('area-denial')&&a.tags.includes('hard-control')))return false;if(a.avoidTags.some(tag=>b.tags.includes(tag))||b.avoidTags.some(tag=>a.tags.includes(tag)))return false;return true;}
function partnerScore(a,b){let score=0;const has=(enemy,tag)=>enemy.tags.includes(tag);if(has(a,'ranged')&&(has(b,'frontline')||has(b,'anchor')))score+=8;if(has(a,'anchor')&&(has(b,'mobile')||has(b,'swarm')||has(b,'ranged')))score+=7;if(has(a,'swarm')&&(has(b,'anchor')||has(b,'frontline')))score+=8;if((has(a,'mobile')||has(a,'committed'))&&(has(b,'anchor')||has(b,'ranged')))score+=6;if(has(a,'area-denial')&&(has(b,'mobile')||has(b,'frontline')))score+=5;if(has(a,'hard-control')&&(has(b,'frontline')||has(b,'ranged')))score+=4;return score+Math.max(0,4-Math.abs(a.encounterCost-b.encounterCost)/4);}
function partnerCandidates(){const focal=currentEnemy();return catalog.filter(candidate=>compatible(focal,candidate)).sort((a,b)=>partnerScore(focal,b)-partnerScore(focal,a)||a.label.localeCompare(b.label));}function ensurePartner(){const candidates=partnerCandidates();if(!candidates.length){state.partnerId='';return null;}if(!candidates.some(enemy=>enemy.id===state.partnerId))state.partnerId=candidates[partnerCycle%candidates.length].id;return catalog.find(enemy=>enemy.id===state.partnerId)||candidates[0];}function countsForWave(){const focal=currentEnemy(),partner=ensurePartner();const table={low:[1,2],standard:[2,3],high:[3,5]};let [focalCount,partnerCount]=table[state.threat]||table.standard;focalCount=Math.min(focalCount,focal.encounter?.maxCount||8,focal.family==='GOBLINS'?4:20);partnerCount=Math.min(partnerCount,partner?.encounter?.maxCount||8,partner?.family==='GOBLINS'?4:20);return {focalCount,partnerCount,partner};}
function choice({label,sub='',meta='',active=false,className='',onClick}){const button=document.createElement('button');button.className=`choice${active?' on':''}${className?` ${className}`:''}`;button.innerHTML=`<b>${label}</b>${sub?`<span>${sub}</span>`:''}${meta?`<em>${meta}</em>`:''}`;button.addEventListener('click',onClick);return button;}function list(...nodes){const root=document.createElement('div');root.className='valueList';root.append(...nodes.flat().filter(Boolean));return root;}function status(title,body,className='statusCard'){const card=document.createElement('div');card.className=className;card.innerHTML=`<b>${title}</b><span>${body}</span>`;return card;}
function groupShortLabel(group){const aliases={'panel-director':'DIRECTOR','panel-loadout':'LOADOUT','panel-combatTiming':'COMBO','panel-sim':'SIM','panel-keyframe':'FEEL','panel-arena-actions':'ACTIONS','extra-hitFeelPanel':'HIT FEEL'};if(aliases[group.id])return aliases[group.id];let label=cleanText(group.label).toUpperCase().replace(/CONTROLS?|SETTINGS?|TUNING PANEL/g,'').trim();if(/ANTELOPE/.test(label))return 'ANTELOPE';if(/PILE.?BUNKER|POW.?BUNKER/.test(label))return 'PILEBUNKER';return label.slice(0,13)||'OPTIONS';}
function categoryDefs(data=snapshot()){const system=(data.controlGroups||[]).map(group=>[`controls:${group.id}`,groupShortLabel(group),group.label||'Arena controls.','systemCategory',group]);return [...fixedCategories,...system,['tools','TOOLS','Reset, fullscreen, and utility actions.','']];}function categoryFor(data,id){return categoryDefs(data).find(def=>def[0]===id);}
function renderCategories(data=snapshot()){const oldTop=categoriesEl.scrollTop,oldLeft=categoriesEl.scrollLeft;const defs=categoryDefs(data);if(!defs.some(def=>def[0]===state.category)){state.category='test';save();}categoriesEl.replaceChildren(...defs.map(([id,label,,className])=>choice({label,active:state.category===id,className,onClick:()=>{state.category=id;save();renderAll({preserveCategoryScroll:true});}})));requestAnimationFrame(()=>{categoriesEl.scrollTop=oldTop;categoriesEl.scrollLeft=oldLeft;});}
function renderType(){return list(...familyOrder.map(family=>choice({label:family,sub:`${catalog.filter(enemy=>enemy.family===family).length} enemies`,active:state.family===family,onClick:()=>{state.family=family;const first=catalog.find(enemy=>enemy.family===family);if(first)state.enemyId=first.id;partnerCycle=0;ensurePartner();save();renderValues();}})));}function renderEnemy(){return list(...catalog.filter(enemy=>enemy.family===state.family).map(enemy=>choice({label:enemy.label,sub:enemy.role,meta:enemy.tags.slice(0,4).join(' · ')||enemy.system,active:enemy.id===state.enemyId,onClick:()=>{state.enemyId=enemy.id;partnerCycle=0;ensurePartner();save();renderValues();}})));}
function renderSpawn(){const focal=currentEnemy();const nodes=['solo','pack','wave'].map(mode=>choice({label:mode.toUpperCase(),sub:mode==='solo'?'One focal enemy':mode==='pack'?'Matching copies':'Focal + partner',active:state.mode===mode,onClick:()=>{state.mode=mode;ensurePartner();save();renderValues();}}));if(state.mode==='solo')nodes.push(status(`${focal.label} SOLO`,'One enemy. Best for studying movement, telegraphs, reach, and hit reactions.'));if(state.mode==='pack'){const max=Math.min(12,focal.encounter?.maxCount||12,focal.family==='GOBLINS'?4:12);state.packCount=Math.max(2,Math.min(max,state.packCount));const card=document.createElement('div');card.className='controlCard';card.innerHTML=`<div class="row"><label>SAME-ENEMY COUNT</label><div class="stepper"><button class="miniBtn" id="countDown">−</button><span class="value">${state.packCount}</span><button class="miniBtn" id="countUp">+</button></div></div><div class="statusCard"><b>${state.packCount} × ${focal.label}</b><span>Tests crowd spacing and repeated pressure.</span></div>`;nodes.push(card);queueMicrotask(()=>{$('countDown')?.addEventListener('click',()=>{state.packCount=Math.max(2,state.packCount-1);save();renderValues({preserveScroll:true});});$('countUp')?.addEventListener('click',()=>{state.packCount=Math.min(max,state.packCount+1);save();renderValues({preserveScroll:true});});});}if(state.mode==='wave'){const candidates=partnerCandidates();const {focalCount,partnerCount,partner}=countsForWave();nodes.push(...['low','standard','high'].map(level=>choice({label:level.toUpperCase(),sub:'Threat level',active:state.threat===level,onClick:()=>{state.threat=level;save();renderValues({preserveScroll:true});}})));const card=document.createElement('div');card.className='controlCard';card.innerHTML=`<label style="font-size:8.5px;color:var(--muted)">MATCHING PARTNER</label><select id="partnerSelect">${candidates.map(enemy=>`<option value="${enemy.id}"${enemy.id===partner?.id?' selected':''}>${enemy.family} · ${enemy.label}</option>`).join('')}</select><div class="row"><label>AUTO MATCH</label><button class="miniBtn" id="rerollBtn">REROLL</button></div><div class="statusCard"><b>${focalCount} × ${focal.label}${partner?` + ${partnerCount} × ${partner.label}`:''}</b><span>${partner?'A compatible cross-system pairing.':'No compatible partner found.'}</span></div>`;nodes.push(card);queueMicrotask(()=>{$('partnerSelect')?.addEventListener('change',event=>{state.partnerId=event.target.value;save();});$('rerollBtn')?.addEventListener('click',()=>{if(candidates.length){partnerCycle=(partnerCycle+1)%candidates.length;state.partnerId=candidates[partnerCycle].id;save();renderValues({preserveScroll:true});}});});}return list(...nodes);}
function renderTestActions(){const configured=buildPlan();return list(status('CONFIGURED TEST',configured?.label||'No valid test configuration.'),choice({label:'SPAWN TEST',sub:'Close the lab and start this configuration',className:'primary',onClick:()=>startTest()}),choice({label:'CLEAR',sub:'Remove all active enemies and queued spawns',className:'danger',onClick:()=>{clearTest();renderValues({preserveScroll:true});}}),choice({label:'REPEAT',sub:lastPlan?`Run ${lastPlan.label} again`:'Run a test first',onClick:()=>{if(lastPlan)startTest(lastPlan);else setMessage('Run a test first.');}}));}function renderRoom(data){const options=data.roomOptions?.length?data.roomOptions:[{id:'large',label:'Large · 24',active:true}];return list(status('OPEN ARENA','One clean hexagonal test chamber. No maze corridors, doors, room transitions, or visible trees.'),...options.map(option=>choice({label:option.label,sub:'Cell size · reloads chamber',active:option.active,onClick:()=>controlBridge()?.setCellSize?.(option.id)})));}function renderTools(){return list(choice({label:'RESET FIGHT',sub:'Respawn player and encounter',onClick:()=>controlBridge()?.resetFight?.()}),choice({label:'FULLSCREEN',sub:'Toggle the complete Enemy Lab',onClick:()=>controlBridge()?.toggleFullscreen?.()}),choice({label:'CLOSE LAB',sub:'Resume the test chamber',onClick:()=>setDockOpen(false)}));}
function renderControl(group,control){const bridge=controlBridge();if(control.kind==='range'){const card=document.createElement('div');card.className='sliderCard';card.innerHTML=`<label>${control.label}<output>${control.value}</output></label><input type="range" min="${control.min}" max="${control.max}" step="${control.step}" value="${control.value}"${control.disabled?' disabled':''}>`;const input=card.querySelector('input'),output=card.querySelector('output');input.addEventListener('input',()=>{output.value=input.value;bridge?.setControl?.(control.id,Number(input.value));});return card;}if(control.kind==='select'){const card=document.createElement('div');card.className='controlCard';const label=document.createElement('label');label.textContent=control.label;label.style.cssText='font-size:8.5px;color:var(--muted);letter-spacing:.06em';const select=document.createElement('select');select.disabled=!!control.disabled;for(const option of control.options||[]){const item=document.createElement('option');item.value=option.value;item.textContent=option.label;item.selected=option.selected;select.appendChild(item);}select.addEventListener('change',()=>bridge?.setControl?.(control.id,select.value));card.append(label,select);return card;}if(control.kind==='text'){const card=document.createElement('div');card.className='controlCard';const label=document.createElement('label');label.textContent=control.label;label.style.cssText='font-size:8.5px;color:var(--muted)';const input=document.createElement('input');input.className='textInput';input.value=control.value||'';input.disabled=!!control.disabled;input.addEventListener('change',()=>bridge?.setControl?.(control.id,input.value));card.append(label,input);return card;}const button=choice({label:control.label,sub:control.note,meta:control.kind==='check'?(control.checked?'ON':'OFF'):'',active:!!(control.active||control.checked),className:control.kind==='check'?'toggle':'',onClick:()=>{const next=control.kind==='check'?!button.classList.contains('on'):undefined;const changed=bridge?.setControl?.(control.id,next);if(!changed)return;if(control.kind==='check'){button.classList.toggle('on',next);const em=button.querySelector('em');if(em)em.textContent=next?'ON':'OFF';}else setTimeout(()=>renderValues({preserveScroll:true}),60);}});button.disabled=!!control.disabled;return button;}function renderControlGroup(group){const nodes=[status(group.label,`${group.controls.length} direct Lab control${group.controls.length===1?'':'s'} · updates the arena system in place.`,'sectionCard')];for(const control of group.controls)nodes.push(renderControl(group,control));return list(...nodes);}
function renderValues({preserveScroll=false}={}){const oldTop=values.scrollTop,oldLeft=values.scrollLeft;const data=snapshot();const def=categoryFor(data,state.category);categoryHint.textContent=def?.[2]||'Choose a setting.';let content;if(state.category==='test')content=renderTestActions();else if(state.category==='capture')content=renderCapture();else if(state.category==='type')content=renderType();else if(state.category==='enemy')content=renderEnemy();else if(state.category==='spawn')content=renderSpawn();else if(state.category==='room')content=renderRoom(data);else if(state.category==='tools')content=renderTools();else if(state.category.startsWith('controls:')){const group=(data.controlGroups||[]).find(item=>`controls:${item.id}`===state.category);content=group?renderControlGroup(group):list(status('CONTROLS LOADING','This arena control section is not available yet.'));}else content=renderTestActions();values.replaceChildren(content);requestAnimationFrame(()=>{if(preserveScroll){values.scrollTop=oldTop;values.scrollLeft=oldLeft;}else{values.scrollTop=0;values.scrollLeft=0;}updateScrollGutter();});}function renderAll({preserveCategoryScroll=false,preserveValueScroll=false}={}){const catTop=categoriesEl.scrollTop,catLeft=categoriesEl.scrollLeft;const data=snapshot();renderCategories(data);renderValues({preserveScroll:preserveValueScroll});if(preserveCategoryScroll)requestAnimationFrame(()=>{categoriesEl.scrollTop=catTop;categoriesEl.scrollLeft=catLeft;});}
function isLandscape(){return matchMedia('(orientation:landscape)').matches;}function scrollMetrics(){const vertical=isLandscape();const viewport=vertical?values.clientHeight:values.clientWidth;const content=vertical?values.scrollHeight:values.scrollWidth;const track=vertical?scrollGutter.clientHeight:scrollGutter.clientWidth;const scroll=vertical?values.scrollTop:values.scrollLeft;return {vertical,viewport,content,track,scroll,maxScroll:Math.max(0,content-viewport)};}function updateScrollGutter(){const {vertical,viewport,content,track,scroll,maxScroll}=scrollMetrics();const minThumb=vertical?38:42;const size=Math.max(minThumb,Math.min(track,content>0?track*(viewport/content):track));const position=maxScroll>0?(track-size)*(scroll/maxScroll):0;scrollGutter.classList.toggle('disabled',maxScroll<=0);scrollGutter.setAttribute('aria-valuenow',String(Math.round(maxScroll>0?scroll/maxScroll*100:0)));if(vertical){scrollThumb.style.height=`${size}px`;scrollThumb.style.width='';scrollThumb.style.transform=`translateY(${position}px)`;}else{scrollThumb.style.width=`${size}px`;scrollThumb.style.height='';scrollThumb.style.transform=`translateX(${position}px)`;}}function scrollFromGutterPointer(event){const {vertical,track,maxScroll}=scrollMetrics();if(maxScroll<=0)return;const rect=scrollGutter.getBoundingClientRect(),thumbRect=scrollThumb.getBoundingClientRect();const thumbSize=vertical?thumbRect.height:thumbRect.width;const pointer=vertical?event.clientY-rect.top:event.clientX-rect.left;const ratio=Math.max(0,Math.min(1,(pointer-thumbSize/2)/Math.max(1,track-thumbSize)));if(vertical)values.scrollTop=ratio*maxScroll;else values.scrollLeft=ratio*maxScroll;}
scrollGutter.addEventListener('pointerdown',event=>{event.preventDefault();scrollGutter.setPointerCapture(event.pointerId);scrollFromGutterPointer(event);});scrollGutter.addEventListener('pointermove',event=>{if(scrollGutter.hasPointerCapture(event.pointerId))scrollFromGutterPointer(event);});scrollGutter.addEventListener('pointerup',event=>{if(scrollGutter.hasPointerCapture(event.pointerId))scrollGutter.releasePointerCapture(event.pointerId);});scrollGutter.addEventListener('pointercancel',event=>{if(scrollGutter.hasPointerCapture(event.pointerId))scrollGutter.releasePointerCapture(event.pointerId);});values.addEventListener('scroll',updateScrollGutter,{passive:true});addEventListener('resize',()=>requestAnimationFrame(updateScrollGutter));new ResizeObserver(()=>requestAnimationFrame(updateScrollGutter)).observe(values);
function setDockOpen(open,{syncArena=true}={}){dockOpen=!!open;dock.classList.toggle('on',dockOpen);veil.classList.toggle('on',dockOpen);document.body.classList.toggle('dockOpen',dockOpen);if(dockOpen){renderAll({preserveCategoryScroll:true,preserveValueScroll:true});requestAnimationFrame(updateScrollGutter);}if(syncArena){const bridge=controlBridge();if(bridge)bridge.setMenuOpen(dockOpen);else{const doc=frameDoc(),panel=doc?.getElementById('panel'),menu=doc?.getElementById('menuBtn');if(panel&&menu&&(!panel.classList.contains('hidden'))!==dockOpen)menu.click();}}}window.__enemyLabSetOpenFromArena=open=>setDockOpen(open,{syncArena:false});window.__enemyLabArenaControlsReady=()=>{if(!dockOpen||controlsRefreshQueued)return;controlsRefreshQueued=true;requestAnimationFrame(()=>{controlsRefreshQueued=false;renderAll({preserveCategoryScroll:true,preserveValueScroll:true});});};
function ensureArenaStarted(){const doc=frameDoc(),gate=doc?.getElementById('startGate');if(gate&&!gate.classList.contains('hidden'))doc.getElementById('startBtn')?.click();}function buildPlan(){const focal=currentEnemy();if(state.mode==='solo')return {label:`${focal.label} Solo`,groups:[{spawnKind:focal.id,count:1}]};if(state.mode==='pack')return {label:`${focal.label} Pack ×${state.packCount}`,groups:[{spawnKind:focal.id,count:state.packCount}]};const {focalCount,partnerCount,partner}=countsForWave();if(!partner)return null;return {label:`${focal.label} + ${partner.label}`,groups:[{spawnKind:focal.id,count:focalCount},{spawnKind:partner.id,count:partnerCount}]};}function showResult(title,detail){result.querySelector('b').textContent=title;result.querySelector('span').textContent=detail;result.classList.add('on');clearTimeout(resultTimer);resultTimer=setTimeout(()=>result.classList.remove('on'),2600);}function startTest(plan=buildPlan()){setMessage('');const system=enemyBridge();if(!system?.startLabScenario){setMessage('Enemy Lab bridge did not load. Reload and try again.');return;}if(!plan){setMessage('No compatible partner is available for this wave.');return;}ensureArenaStarted();setDockOpen(false);const response=system.startLabScenario(-777,plan);if(!response?.ok){setMessage(response?.error||'Enemy Lab could not spawn this composition.');setDockOpen(true);return;}lastPlan=JSON.parse(JSON.stringify(plan));running=true;sawEnemy=false;testStart=performance.now();startHp=system.playerHp;testBadge.innerHTML=`<strong>${plan.label.toUpperCase()}</strong> · spawning`;save();}function clearTest(){const system=enemyBridge();system?.clearRoomRuntime?.();running=false;sawEnemy=false;testBadge.innerHTML='<strong>ENEMY LAB</strong> · chamber clear';}
function poll(){const system=enemyBridge();if(system){const alive=system.enemies?.filter(enemy=>enemy.hp>0).length||0;const pending=(system.queuedSpawnCount||0)+(system.telegraphCount||0);if(running){if(alive>0||pending>0)sawEnemy=true;const elapsed=(performance.now()-testStart)/1000;testBadge.innerHTML=`<strong>${lastPlan?.label?.toUpperCase()||'TEST'}</strong> · ${alive} LEFT · ${elapsed.toFixed(1)}s`;if(sawEnemy&&alive===0&&pending===0){running=false;const damage=Math.max(0,Math.round(startHp-system.playerHp));showResult('TEST CLEAR',`${elapsed.toFixed(1)} seconds · ${damage} damage taken`);testBadge.innerHTML=`<strong>TEST CLEAR</strong> · ${elapsed.toFixed(1)}s · ${damage} damage`;}else if(system.playerHp<=0){running=false;showResult('PLAYER DOWN',`${alive} enemies remained`);testBadge.innerHTML=`<strong>PLAYER DOWN</strong> · ${alive} LEFT`;}}}requestAnimationFrame(poll);}function prepareFrame(){const doc=frameDoc();if(!doc)return;const topBar=doc.getElementById('topBar'),panel=doc.getElementById('panel'),gate=doc.getElementById('startGate');if(topBar)topBar.style.display='flex';const menuButton=doc.getElementById('menuBtn');if(menuButton)menuButton.style.display='none';if(panel){panel.classList.add('hidden');panel.style.visibility='hidden';panel.style.pointerEvents='none';}if(gate&&!gate.classList.contains('hidden'))doc.getElementById('startBtn')?.click();const wait=()=>{const system=enemyBridge(),bridge=controlBridge();if(!system||!bridge?.isReady?.()||(capturePage&&!captureFacade.ready())){setTimeout(wait,60);return;}if(capturePage){captureFacade.reset(capturePayload());updateCaptureBadge();if(state.category==='capture')renderValues({preserveScroll:true});}else system.clearRoomRuntime?.();frame.classList.add('ready');if(!capturePage)testBadge.innerHTML='<strong>ENEMY LAB</strong> · chamber ready';};wait();}
frame.addEventListener('load',prepareFrame);if(frame.contentDocument?.readyState==='complete')prepareFrame();$('labBtn').addEventListener('click',()=>setDockOpen(!dockOpen));$('closeBtn').addEventListener('click',()=>setDockOpen(false));veil.addEventListener('click',()=>setDockOpen(false));ensurePartner();renderAll();poll();
