<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Combat Trial — Direct Controls</title>
<style>
:root{color-scheme:dark;--panel:rgba(10,20,22,.90);--line:#2c4a47;--gold:#e8a04c;--text:#d8eee9;--muted:#7fb8b0;--purple:#d7b6ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071012;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text);touch-action:none}#arenaFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#071012}.overlay{position:fixed;inset:0;z-index:20;pointer-events:none}.top{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:7px;align-items:center}.tag,.iconBtn{pointer-events:auto;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);min-height:36px}.tag{padding:8px 10px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}.iconBtn{width:42px;font-size:20px}.abilityDock{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:stretch;gap:6px;max-width:calc(100vw - 250px);opacity:0;transition:opacity .15s}.running .abilityDock,.running .touchAttacks{opacity:1}.dockBtn,.abilityCard{pointer-events:auto;border:1px solid #60437b;background:rgba(20,20,31,.92);color:var(--purple);border-radius:8px;box-shadow:0 3px 0 rgba(0,0,0,.45);touch-action:manipulation}.dockBtn{width:44px;min-height:72px;font-size:22px}.dockBtn:active,.attackBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}.abilityCard{position:relative;width:min(260px,42vw);min-height:72px;padding:8px 11px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;gap:2px 8px;overflow:hidden;text-align:left}.abilityCard.ready{border-color:#e8a04c;color:#ffe6aa}.abilityName{font-size:13px;font-weight:900;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.abilityKey{font-size:9px;color:#9d83b8;align-self:center}.abilityDesc{grid-column:1/3;font-size:9px;line-height:1.25;color:#9abcb6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.abilityMeta{font-size:9px;color:#b99bd5}.abilityStatus{font-size:10px;font-weight:900;text-align:right}.coolShade{position:absolute;inset:auto 0 0;height:0;background:rgba(3,5,10,.72);pointer-events:none;transition:height .08s linear}.touchAttacks{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,58px);grid-template-rows:repeat(2,58px);gap:7px;opacity:0;transition:opacity .15s}.attackBtn{pointer-events:auto;border-radius:50%;border:2px solid var(--line);background:rgba(18,36,38,.82);color:#9fd2c9;font-family:inherit;font-size:10px;font-weight:900;box-shadow:0 3px 0 #081112;touch-action:manipulation}.attackBtn b{display:block;font-size:19px;color:var(--gold);line-height:1}.attackBtn.ability{border-color:#60437b;color:var(--purple)}.attackBtn.fire{background:#2c4a47;transform:translateY(2px)}#status{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);max-width:min(520px,70vw);padding:6px 10px;border:1px solid rgba(44,74,71,.8);border-radius:7px;background:rgba(8,17,18,.82);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#9fd2c9;text-align:center;opacity:0;transition:opacity .15s}.running #status{opacity:1}.error{color:#ff9070!important;border-color:#6e3a24!important}.padHint{display:none}@media(pointer:fine){.touchAttacks{display:none}.abilityDock{max-width:calc(100vw - 40px)}#status{bottom:92px}}@media(max-width:760px) and (orientation:landscape){.tag{display:none}.abilityDock{left:max(145px,calc(env(safe-area-inset-left) + 145px));right:max(145px,calc(env(safe-area-inset-right) + 145px));transform:none;max-width:none;justify-content:center}.abilityCard{width:min(250px,48vw);min-height:64px;padding:6px 9px}.dockBtn{min-height:64px}.abilityDesc{display:none}.touchAttacks{grid-template-columns:repeat(2,52px);grid-template-rows:repeat(2,52px)}#status{bottom:80px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"}}</script>
</head>
<body>
<iframe id="arenaFrame" src="combat-arena.html" title="Combat Trial arena" allow="fullscreen; gamepad"></iframe>
<div class="overlay">
  <div class="top"><div class="tag">Combat Trial · Direct Attacks · No Stamina</div><button class="iconBtn" id="fullscreenBtn" aria-label="Toggle fullscreen">⛶</button></div>
  <div id="status">Loading combat systems…</div>
  <div class="abilityDock" aria-label="Ability selector">
    <button class="dockBtn" id="prevAbility" aria-label="Previous ability">‹</button>
    <button class="abilityCard" id="abilityCard" aria-label="Activate selected ability">
      <span class="abilityName" id="abilityName">Loading…</span><span class="abilityKey">RB</span>
      <span class="abilityMeta" id="abilityMeta">D-pad ◀ ▶</span><span class="abilityStatus" id="abilityStatus">WAIT</span>
      <span class="abilityDesc" id="abilityDesc"></span><span class="coolShade" id="coolShade"></span>
    </button>
    <button class="dockBtn" id="nextAbility" aria-label="Next ability">›</button>
  </div>
  <div class="touchAttacks">
    <button class="attackBtn" data-attack="horizontal"><b>□</b>HORIZONTAL</button>
    <button class="attackBtn" data-attack="vertical"><b>△</b>VERTICAL</button>
    <button class="attackBtn" data-attack="stab"><b>○</b>THRUST</button>
    <button class="attackBtn ability" id="touchAbility"><b>RB</b>ABILITY</button>
  </div>
</div>
<script type="module">
import { WARDEN_ABILITY_CARDS } from './src/warden-ability-cards.js';
import { playWardenAbility, updateWardenAbilityRuntime } from './src/warden-ability-runtime.js';

const frame = document.getElementById('arenaFrame');
const statusEl = document.getElementById('status');
const cardEl = document.getElementById('abilityCard');
const nameEl = document.getElementById('abilityName');
const metaEl = document.getElementById('abilityMeta');
const descEl = document.getElementById('abilityDesc');
const abilityStatusEl = document.getElementById('abilityStatus');
const coolShade = document.getElementById('coolShade');
const parentGetGamepads = navigator.getGamepads?.bind(navigator);
const cooldowns = new Map(WARDEN_ABILITY_CARDS.map(card => [card.id, 0]));
let selectedIndex = 0;
let lastTime = performance.now();
let childReady = false;
const previousButtons = {};

Object.defineProperty(window, '__arena', { configurable:true, get(){ return frame.contentWindow?.__arena || null; } });
window.__POWBUNKER_CAN_PLAY__ = () => {
  try { return frame.contentWindow?.__POWBUNKER_CAN_PLAY__?.() ?? false; }
  catch (_) { return false; }
};
window.addEventListener('powbunker:play', () => {
  try { frame.contentWindow?.dispatchEvent(new frame.contentWindow.CustomEvent('powbunker:play')); }
  catch (error) { showStatus(`Pilebunker bridge failed: ${error.message}`, true); }
});

function showStatus(text, error = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('error', error);
}
function api(){ return frame.contentWindow?.__arena || null; }
function selectedCard(){ return WARDEN_ABILITY_CARDS[selectedIndex] || null; }
function clamp(value, min, max){ return Math.max(min, Math.min(max, value)); }
function setSelected(index){
  const count = WARDEN_ABILITY_CARDS.length;
  selectedIndex = ((index % count) + count) % count;
  renderAbility();
  const card = selectedCard();
  showStatus(`${card.name} selected · RB activates`);
}
function cycleAbility(direction){ setSelected(selectedIndex + direction); }
function renderAbility(){
  const card = selectedCard();
  if (!card) return;
  const remaining = cooldowns.get(card.id) || 0;
  const total = Math.max(.05, Number(card.cooldown) || 1);
  const ready = remaining <= 0;
  nameEl.textContent = card.name;
  metaEl.textContent = `${selectedIndex + 1}/${WARDEN_ABILITY_CARDS.length} · ${total.toFixed(total < 10 ? 1 : 0)}s cooldown`;
  descEl.textContent = card.description || '';
  abilityStatusEl.textContent = ready ? 'READY' : `${remaining.toFixed(1)}s`;
  coolShade.style.height = ready ? '0%' : `${clamp(remaining / total, 0, 1) * 100}%`;
  cardEl.classList.toggle('ready', ready);
  cardEl.setAttribute('aria-label', `${card.name}. ${ready ? 'Ready' : `${remaining.toFixed(1)} seconds remaining`}. Press Right Bumper to activate.`);
}
function flashButton(selector){
  document.querySelectorAll(selector).forEach(button => {
    button.classList.add('fire');
    setTimeout(() => button.classList.remove('fire'), 130);
  });
}
function directAttack(group){
  const arenaApi = api();
  if (!arenaApi?.PC?.triggerCombatAttack) return showStatus('Direct attack system is not ready.', true);
  arenaApi.PC.triggerCombatAttack(group);
  flashButton(`[data-attack="${group}"]`);
  showStatus(`${group === 'stab' ? 'Thrust' : group} attack`);
}
function activateAbility(){
  const card = selectedCard();
  if (!card) return;
  const remaining = cooldowns.get(card.id) || 0;
  if (remaining > 0) return showStatus(`${card.name} cooling down · ${remaining.toFixed(1)}s`);
  const arenaApi = api();
  if (!arenaApi) return showStatus('Arena is not ready.', true);
  const costFreeCard = { ...card, cost:0 };
  const played = playWardenAbility(costFreeCard);
  if (!played) return showStatus(`${card.name} could not activate here.`, true);
  cooldowns.set(card.id, Math.max(.05, Number(card.cooldown) || 1));
  flashButton('#touchAbility,#abilityCard');
  showStatus(`${card.name} activated`);
  renderAbility();
}
function triggerDodge(){
  const arenaApi = api();
  if (arenaApi?.triggerDodge) arenaApi.triggerDodge();
}
function cycleWeapon(direction){
  const arenaApi = api();
  if (arenaApi?.cycleWeapon) arenaApi.cycleWeapon(direction);
}
function toggleChildMenu(){
  try { frame.contentDocument?.getElementById('menuBtn')?.click(); }
  catch (_) {}
}
function keepAttackStaminaFull(){
  const resource = api()?.arena?.stamina;
  if (!resource) return;
  resource.v = 100;
  resource.pending = 0;
  resource.recoverDelayT = 0;
  const fill = frame.contentDocument?.getElementById('stFill');
  if (fill) fill.style.width = '100%';
}
function installChildPresentation(){
  const doc = frame.contentDocument;
  if (!doc || doc.getElementById('combatTrialOverrides')) return;
  const style = doc.createElement('style');
  style.id = 'combatTrialOverrides';
  style.textContent = `#cardRow,#stWrap,#abilityStaminaWrap,#stanceBtn,#shuffleBtn,.btnrow,#hint,#fsBtn,#sgFsBtn,#wardenAbilitySettings{display:none!important}#hud{top:52px!important}#weaponBtn{width:100%}`;
  doc.head.appendChild(style);
  const title = doc.querySelector('#startCard .sgTitle');
  const hint = doc.querySelector('#startCard .sgHint');
  if (title) title.textContent = 'COMBAT TRIAL';
  if (hint) hint.textContent = 'Square: horizontal · Triangle: vertical · Circle: thrust · D-pad left/right: ability · RB: activate';
  doc.title = 'Combat Trial Arena';
}
function installChildGamepadMask(){
  const childNavigator = frame.contentWindow?.navigator;
  if (!childNavigator || !parentGetGamepads) return false;
  const masked = () => {
    const real = parentGetGamepads()?.[0];
    if (!real) return [];
    return [{
      id:real.id || 'Combat Trial movement proxy',
      connected:true,
      mapping:real.mapping || 'standard',
      axes:Array.from(real.axes || [0,0,0,0]),
      buttons:Array.from({ length:Math.max(20, real.buttons?.length || 0) }, () => ({ pressed:false, touched:false, value:0 })),
      timestamp:real.timestamp || performance.now(),
    }];
  };
  try {
    Object.defineProperty(childNavigator, 'getGamepads', { configurable:true, value:masked });
    return true;
  } catch (_) {
    try {
      Object.defineProperty(Object.getPrototypeOf(childNavigator), 'getGamepads', { configurable:true, value:masked });
      return true;
    } catch (error) {
      showStatus(`Could not isolate original controller mapping: ${error.message}`, true);
      return false;
    }
  }
}
function pollGamepad(){
  const gp = parentGetGamepads?.()?.[0];
  if (!gp) return;
  const down = index => !!gp.buttons?.[index]?.pressed;
  const edge = (name, index, action) => {
    const active = down(index);
    if (active && !previousButtons[name]) action();
    previousButtons[name] = active;
  };
  edge('cross', 0, triggerDodge);
  edge('circle', 1, () => directAttack('stab'));
  edge('square', 2, () => directAttack('horizontal'));
  edge('triangle', 3, () => directAttack('vertical'));
  edge('rb', 5, activateAbility);
  edge('select', 8, toggleChildMenu);
  edge('start', 9, toggleChildMenu);
  edge('dpadUp', 12, () => cycleWeapon(-1));
  edge('dpadDown', 13, () => cycleWeapon(1));
  edge('dpadLeft', 14, () => cycleAbility(-1));
  edge('dpadRight', 15, () => cycleAbility(1));
}
function updateCooldowns(dt){
  for (const card of WARDEN_ABILITY_CARDS) {
    const remaining = cooldowns.get(card.id) || 0;
    if (remaining > 0) cooldowns.set(card.id, Math.max(0, remaining - dt));
  }
}
function frameLoop(now){
  const dt = Math.min(.05, Math.max(0, (now - lastTime) / 1000));
  lastTime = now;
  const arenaApi = api();
  if (arenaApi) {
    if (!childReady) {
      childReady = true;
      installChildPresentation();
      installChildGamepadMask();
      renderAbility();
      showStatus('Square horizontal · Triangle vertical · Circle thrust · D-pad ◀ ▶ ability · RB activate');
    }
    const running = !!arenaApi.arena?.started;
    document.body.classList.toggle('running', running);
    keepAttackStaminaFull();
    pollGamepad();
    if (running && !arenaApi.arena?.paused) {
      updateCooldowns(dt);
      updateWardenAbilityRuntime(dt);
    }
    renderAbility();
  }
  requestAnimationFrame(frameLoop);
}
frame.addEventListener('load', () => {
  childReady = false;
  setTimeout(() => { installChildPresentation(); installChildGamepadMask(); }, 0);
});
document.getElementById('prevAbility').addEventListener('pointerdown', event => { event.preventDefault(); cycleAbility(-1); });
document.getElementById('nextAbility').addEventListener('pointerdown', event => { event.preventDefault(); cycleAbility(1); });
document.getElementById('abilityCard').addEventListener('pointerdown', event => { event.preventDefault(); activateAbility(); });
document.getElementById('touchAbility').addEventListener('pointerdown', event => { event.preventDefault(); activateAbility(); });
document.querySelectorAll('[data-attack]').forEach(button => button.addEventListener('pointerdown', event => { event.preventDefault(); directAttack(button.dataset.attack); }));
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});
addEventListener('keydown', event => {
  if (event.repeat) return;
  const key = event.key.toLowerCase();
  if (key === '1') directAttack('horizontal');
  if (key === '2') directAttack('vertical');
  if (key === '3') directAttack('stab');
  if (key === '[' || key === 'arrowleft') cycleAbility(-1);
  if (key === ']' || key === 'arrowright') cycleAbility(1);
  if (key === 'e') activateAbility();
  if (key === ' ') triggerDodge();
  if (key === 'm') toggleChildMenu();
});
renderAbility();
requestAnimationFrame(frameLoop);
</script>
</body>
</html>
