<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Combat Trial</title>
<style>
:root{color-scheme:dark;--bg:rgba(10,20,22,.9);--line:#2c4a47;--gold:#e8a04c;--text:#d8eee9;--purple:#d7b6ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071012;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text);touch-action:none}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.ui{position:fixed;inset:0;z-index:20;pointer-events:none}.top{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:7px}.tag,.btn{pointer-events:auto;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)}.tag{padding:9px 11px;font-size:9px;letter-spacing:.1em;color:var(--gold)}#fs{width:42px;font-size:20px}.dock{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;opacity:0}.running .dock,.running .touch{opacity:1}.nav{width:44px;font-size:23px}.card{position:relative;width:min(270px,44vw);min-height:72px;padding:8px 11px;overflow:hidden;text-align:left;border-color:#60437b;color:var(--purple);display:grid;grid-template-columns:1fr auto;gap:3px 8px}.card.ready{border-color:var(--gold);color:#ffe6aa}.name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small{font-size:9px;color:#9abcb6}.state{font-size:10px;font-weight:900;text-align:right}.shade{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(3,5,10,.72);pointer-events:none}.touch{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,56px);gap:7px;opacity:0}.attack{width:56px;height:56px;border-radius:50%;font-size:9px;font-weight:900}.attack b{display:block;font-size:18px;color:var(--gold)}.ability{border-color:#60437b;color:var(--purple)}#status{position:absolute;left:50%;bottom:91px;transform:translateX(-50%);padding:6px 9px;max-width:68vw;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:9px;text-align:center;opacity:0}.running #status{opacity:1}.error{color:#ff9070!important;border-color:#6e3a24!important}@media(pointer:fine){.touch{display:none}}@media(max-width:760px) and (orientation:landscape){.tag{display:none}.dock{left:max(142px,calc(env(safe-area-inset-left) + 142px));right:max(142px,calc(env(safe-area-inset-right) + 142px));transform:none;justify-content:center}.card{min-height:62px;width:min(250px,46vw)}.touch{grid-template-columns:repeat(2,50px)}.attack{width:50px;height:50px}#status{bottom:74px}}
</style></head><body>
<iframe id="arena" src="combat-arena.html" title="Combat Trial arena" allow="fullscreen; gamepad"></iframe>
<div class="ui"><div class="top"><div class="tag">COMBAT TRIAL · DIRECT ATTACKS · NO STAMINA</div><button class="btn" id="fs">⛶</button></div><div id="status">Loading combat systems…</div>
<div class="dock"><button class="btn nav" id="prev">‹</button><button class="btn card" id="card"><span class="name" id="name">Loading…</span><span class="small">RB</span><span class="small" id="meta"></span><span class="state" id="state">WAIT</span><span class="small" id="desc"></span><span class="shade" id="shade"></span></button><button class="btn nav" id="next">›</button></div>
<div class="touch"><button class="btn attack" data-atk="horizontal"><b>□</b>HORIZONTAL</button><button class="btn attack" data-atk="vertical"><b>△</b>VERTICAL</button><button class="btn attack" data-atk="stab"><b>○</b>THRUST</button><button class="btn attack ability" id="act"><b>RB</b>ABILITY</button></div></div>
<script type="module">
import{WARDEN_ABILITY_CARDS as CARDS}from'./src/warden-ability-cards.js';
const f=document.getElementById('arena'),getPads=navigator.getGamepads?.bind(navigator),cd=new Map(CARDS.map(c=>[c.id,0])),prev={};let pick=0,last=performance.now(),ready=false,runtime=null;
const $=id=>document.getElementById(id),api=()=>f.contentWindow?.__arena||null,card=()=>CARDS[pick];
function say(t,e=false){$('status').textContent=t;$('status').classList.toggle('error',e)}
function render(){const c=card(),r=cd.get(c.id)||0,total=Math.max(.05,+c.cooldown||1),ok=r<=0;$('name').textContent=c.name;$('meta').textContent=`${pick+1}/${CARDS.length} · ${total}s cooldown`;$('desc').textContent=c.description||'';$('state').textContent=ok?'READY':`${r.toFixed(1)}s`;$('shade').style.height=ok?'0%':`${Math.min(100,r/total*100)}%`;$('card').classList.toggle('ready',ok)}
function select(d){pick=(pick+d+CARDS.length)%CARDS.length;render();say(`${card().name} selected · RB activates`)}
function attack(g){const a=api();if(!a?.PC?.triggerCombatAttack)return say('Direct attack system is not ready.',true);a.PC.triggerCombatAttack(g);say(`${g==='stab'?'Thrust':g} attack`)}
function ability(){const c=card(),r=cd.get(c.id)||0;if(r>0)return say(`${c.name} cooling down · ${r.toFixed(1)}s`);if(!runtime)return say('Ability runtime is not ready.',true);if(!runtime.playWardenAbility({...c,cost:0}))return say(`${c.name} could not activate here.`,true);cd.set(c.id,Math.max(.05,+c.cooldown||1));render();say(`${c.name} activated`)}
function dodge(){api()?.triggerDodge?.()}function weapon(d){api()?.cycleWeapon?.(d)}function menu(){f.contentDocument?.getElementById('menuBtn')?.click()}
function childSetup(){const d=f.contentDocument;if(!d)return;if(!d.getElementById('trialStyle')){const s=d.createElement('style');s.id='trialStyle';s.textContent='#cardRow,#stWrap,#abilityStaminaWrap,#stanceBtn,#shuffleBtn,.btnrow,#hint,#fsBtn,#sgFsBtn,#wardenAbilitySettings{display:none!important}#weaponBtn{width:100%}';d.head.appendChild(s);d.querySelector('#startCard .sgTitle').textContent='COMBAT TRIAL';d.querySelector('#startCard .sgHint').textContent='Square horizontal · Triangle vertical · Circle thrust · D-pad left/right ability · RB activate'}if(!d.getElementById('trialRuntime')){const s=d.createElement('script');s.id='trialRuntime';s.type='module';s.textContent="import * as r from './src/warden-ability-runtime.js';window.__trialRuntime=r";d.head.appendChild(s)}maskPad()}
function maskPad(){const n=f.contentWindow?.navigator;if(!n||!getPads)return;const fn=()=>{const g=getPads()?.[0];return g?[{id:g.id,connected:true,mapping:g.mapping,axes:Array.from(g.axes||[]),buttons:Array.from({length:20},()=>({pressed:false,value:0}))}]:[]};try{Object.defineProperty(n,'getGamepads',{configurable:true,value:fn})}catch(_){try{Object.defineProperty(Object.getPrototypeOf(n),'getGamepads',{configurable:true,value:fn})}catch(e){say(`Controller isolation failed: ${e.message}`,true)}}}
function gamepad(){const g=getPads?.()?.[0];if(!g)return;const edge=(n,i,fn)=>{const v=!!g.buttons?.[i]?.pressed;if(v&&!prev[n])fn();prev[n]=v};edge('x',0,dodge);edge('o',1,()=>attack('stab'));edge('s',2,()=>attack('horizontal'));edge('t',3,()=>attack('vertical'));edge('rb',5,ability);edge('sel',8,menu);edge('start',9,menu);edge('up',12,()=>weapon(-1));edge('down',13,()=>weapon(1));edge('left',14,()=>select(-1));edge('right',15,()=>select(1))}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const a=api();if(a){if(!ready){ready=true;childSetup();say('Square horizontal · Triangle vertical · Circle thrust · D-pad ◀ ▶ ability · RB activate')}runtime=f.contentWindow?.__trialRuntime||null;const running=!!a.arena?.started;document.body.classList.toggle('running',running);const st=a.arena?.stamina;if(st){st.v=100;st.pending=0;st.recoverDelayT=0}gamepad();if(running&&!a.arena?.paused)for(const c of CARDS)cd.set(c.id,Math.max(0,(cd.get(c.id)||0)-dt));render()}requestAnimationFrame(loop)}
f.addEventListener('load',()=>{ready=false;setTimeout(childSetup,0)});$('prev').onpointerdown=e=>{e.preventDefault();select(-1)};$('next').onpointerdown=e=>{e.preventDefault();select(1)};$('card').onpointerdown=e=>{e.preventDefault();ability()};$('act').onpointerdown=e=>{e.preventDefault();ability()};document.querySelectorAll('[data-atk]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();attack(b.dataset.atk)});$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==='1')attack('horizontal');if(k==='2')attack('vertical');if(k==='3')attack('stab');if(k==='[')select(-1);if(k===']')select(1);if(k==='e')ability();if(k===' ')dodge();if(k==='m')menu()});render();requestAnimationFrame(loop);
</script></body></html>
