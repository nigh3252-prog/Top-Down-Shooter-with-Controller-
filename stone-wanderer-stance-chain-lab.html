<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Stone Wanderer Lab + Combat Audio Director</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#eef6ff;font-family:system-ui,Segoe UI,Arial,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070d}.audioShell{position:fixed;z-index:30;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:min(420px,calc(100vw - 20px));border:1px solid rgba(207,155,255,.32);border-radius:18px;background:rgba(9,10,18,.84);box-shadow:0 18px 55px #0009;backdrop-filter:blur(10px);overflow:hidden}.audioShell.collapsed .audioBody{display:none}.audioHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.10)}.audioHead h1{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.audioHead button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#eef6ff;border-radius:11px;padding:7px 9px;font-weight:900}.audioBody{display:grid;gap:9px;padding:11px 12px 12px}.row{display:grid;grid-template-columns:88px 1fr 40px;gap:8px;align-items:center;font-size:12px;color:#aab3c5}.row input{width:100%;accent-color:#c474ff}.tog{display:flex;align-items:center;gap:8px;font-size:12px;color:#aab3c5}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.grid button{min-height:40px;border-radius:12px;border:1px solid rgba(196,116,255,.28);background:rgba(14,18,31,.82);color:#eef6ff;font-weight:900}.log{min-height:32px;font-size:12px;line-height:1.35;color:#e5ccff}.links{display:flex;gap:7px;flex-wrap:wrap}.links a{color:#eef6ff;text-decoration:none;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);padding:6px 9px;font-size:12px;font-weight:800}@media(max-width:740px){.audioShell{left:8px;right:8px;width:auto}.links,.audioBody p{display:none}.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<iframe id="labFrame" src="stone-wanderer-stance-chain-lab-core.html" title="Stone Wanderer Stance Chain Lab Core"></iframe>
<section class="audioShell" id="audioShell">
  <div class="audioHead"><h1>Combat Audio Director</h1><button id="collapseAudio">−</button></div>
  <div class="audioBody">
    <label class="tog"><input id="enabled" type="checkbox" checked> enabled — listens to Stone Lab events</label>
    <label class="row"><span>Beast mix</span><input id="beast" type="range" min="0" max="100" value="55"><b id="beastOut">55</b></label>
    <label class="row"><span>Grit</span><input id="grit" type="range" min="0" max="100" value="100"><b id="gritOut">100</b></label>
    <label class="row"><span>Damage</span><input id="damage" type="range" min="0" max="100" value="0"><b id="damageOut">0</b></label>
    <div class="grid"><button data-test="swingLight">Swing</button><button data-test="hitLight">Hit</button><button data-test="swingHeavy">Heavy</button><button data-test="kill">Kill</button><button data-test="hurt">Hurt</button></div>
    <div class="log" id="log">Loading Stone Lab…</div>
    <div class="links"><a href="stone-wanderer-stance-chain-lab-core.html">Raw core</a><a href="sound-foundry-retro-beasts.html">Sound Foundry</a></div>
  </div>
</section>
<script>
'use strict';
const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const frame=$('labFrame'), state={enabled:true,beast:.55,grit:1,damage:0,surge:0,lastDummy:'',weapon:'Longsword',group:'vertical'};
function sync(){state.enabled=$('enabled').checked;state.beast=+$('beast').value/100;state.grit=+$('grit').value/100;state.damage=+$('damage').value/100;$('beastOut').textContent=$('beast').value;$('gritOut').textContent=$('grit').value;$('damageOut').textContent=$('damage').value;}
['enabled','beast','grit','damage'].forEach(id=>$(id).addEventListener('input',sync));sync();
$('collapseAudio').onclick=()=>{const shell=$('audioShell');shell.classList.toggle('collapsed');$('collapseAudio').textContent=shell.classList.contains('collapsed')?'+':'−'};
const AudioDirector=(()=>{let AC,master,effort,weapon,impact,beast,noiseBuf,lastAt=0;function init(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.74;const comp=AC.createDynamicsCompressor();comp.threshold.value=-13;comp.ratio.value=7;comp.attack.value=.003;comp.release.value=.14;effort=AC.createGain();weapon=AC.createGain();impact=AC.createGain();beast=AC.createGain();effort.connect(master);weapon.connect(master);impact.connect(master);beast.connect(master);master.connect(comp).connect(AC.destination);noiseBuf=AC.createBuffer(1,AC.sampleRate*1.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);let seed=7777;for(let i=0;i<d.length;i++){seed=seed*16807%2147483647;d[i]=seed/1073741823-1;}}function env(g,t,p,d,a=.003){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,p),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d)}function tone(bus,type,f0,f1,dur,g,delay=0){init();const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(20,f0),t);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur*.88);env(gn,t,g,dur);o.connect(gn).connect(bus);o.start(t);o.stop(t+dur+.04)}function noise(bus,filter,f0,f1,dur,g,delay=0,q=1){init();const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=noiseBuf;s.playbackRate.value=.65+Math.random()*.9;f.type=filter;f.Q.value=q;f.frequency.setValueAtTime(Math.max(25,f0),t);if(f1)f.frequency.exponentialRampToValueAtTime(Math.max(25,f1),t+dur*.92);env(gn,t,g,dur,.002);s.connect(f).connect(gn).connect(bus);s.start(t,Math.random()*.7);s.stop(t+dur+.05)}function pulse(bus,freq,count,g,delay=0){for(let i=0;i<count;i++){tone(bus,'square',freq*(1+Math.random()*.08),freq*.55,.052,g*(1-i/(count+1)),delay+i*.074);noise(bus,'bandpass',freq*5.2,freq*1.2,.04,g*.42,delay+i*.074,4)}}function growl(kind,amount,delay=0){amount=clamp(amount,0,1);if(amount<=.025)return;const g=.07+amount*.34;if(kind==='dog'){tone(beast,'sawtooth',160,78,.18,g,delay);noise(beast,'bandpass',720,220,.20,g*.55,delay,3)}else if(kind==='lion'){tone(beast,'sawtooth',84,42,.58,g*.95,delay);noise(beast,'lowpass',900,125,.56,g*.72,delay,1.15)}else if(kind==='koala'){pulse(beast,58,4,g*.65,delay);tone(beast,'triangle',72,38,.38,g*.55,delay)}else if(kind==='walrus'){pulse(beast,104,3,g*.75,delay);noise(beast,'bandpass',430,92,.42,g*.70,delay,5)}else{tone(beast,'square',255,92,.16,g,delay);noise(beast,'bandpass',1550,260,.18,g*.55,delay,5)}}function weaponKind(){const w=state.weapon.toLowerCase();if(w.includes('hammer')||w.includes('mace'))return'blunt';if(w.includes('axe'))return'axe';if(w.includes('spear')||w.includes('rapier'))return'thrust';if(w.includes('claymore')||w.includes('greatsword'))return'heavyBlade';return'blade'}function beastLevel(ctx={}){return clamp(state.beast*.72+state.damage*.55+state.surge*.55+(ctx.damage||0)/175+(ctx.kill?.22:0),0,1)}function play(event,ctx={}){if(!state.enabled)return;init();if(AC.state==='suspended')AC.resume();const now=performance.now();if(now-lastAt<24&&event!=='hurt')return;lastAt=now;const b=beastLevel(ctx),gr=state.grit,k=weaponKind(),heavy=k==='blunt'||k==='heavyBlade'||(ctx.damage||0)>=36||event.includes('Heavy')||event==='kill';effort.gain.value=.52+b*.18;weapon.gain.value=.68+gr*.22;impact.gain.value=.82+gr*.2;beast.gain.value=.18+b*.78;if(event==='swingLight'){const thrust=k==='thrust'||state.group==='stab';tone(effort,'triangle',thrust?155:178,thrust?92:105,.12,.07);noise(weapon,'bandpass',thrust?1250:820,thrust?2700:2200,thrust?.10:.14,.18*gr,.01,thrust?3.4:2.1);tone(weapon,'square',thrust?760:560,thrust?460:330,.044,.035*gr,.02);if(b>.42)growl(thrust?'mutant':'dog',b*.32,.006)}else if(event==='swingHeavy'){tone(effort,'triangle',132,58,.28,.15);noise(weapon,'bandpass',330,1500,.29,.34*gr,.01,1.6);tone(weapon,'square',165,90,.13,.06*gr,.04);growl(k==='blunt'?'walrus':(b>.62?'koala':'dog'),b*.54,.025)}else if(event==='hitLight'){noise(impact,'highpass',2800,1180,.055,.34*gr,0,1);tone(impact,'square',390,185,.075,.12*gr);noise(impact,'bandpass',850,220,.11,.16,0,2.3);if(b>.45)growl(k==='thrust'?'mutant':'dog',b*.24,.02)}else if(event==='hitHeavy'){tone(impact,'sine',145,39,.22,.42);noise(impact,'lowpass',680,110,.2,.46,0,1);noise(impact,'bandpass',1600,260,.13,.28*gr,.015,3);growl(k==='blunt'?'walrus':(k==='axe'?'dog':'koala'),b*.55,.01);if(b>.72)growl('lion',b*.34,.04)}else if(event==='kill'){tone(impact,'sine',170,36,.28,.52);noise(impact,'lowpass',760,80,.27,.5,0,1.1);tone(weapon,'square',310,110,.09,.09*gr,.02);growl(k==='blunt'?'walrus':'lion',b*.65,.02);growl('koala',b*.36,.06)}else if(event==='hurt'){tone(effort,'sawtooth',220,70,.2,.18);noise(effort,'bandpass',520,140,.22,.24,0,2.5);growl(state.damage>.55?'koala':'dog',clamp(.25+b*.75,0,1),.01)}$('log').textContent=`${event} · ${state.weapon} · beast ${Math.round(beastLevel(ctx)*100)}%`;}
return{play};})();
function hookLab(){let doc;try{doc=frame.contentDocument}catch(e){$('log').textContent='Could not access Stone Lab iframe.';return}if(!doc){setTimeout(hookLab,250);return}$('log').textContent='Hooked to Stone Lab. Use the lab normally.';doc.addEventListener('pointerdown',e=>{const attack=e.target.closest?.('[data-lab-action="attack"],[data-attack]');if(attack){const group=attack.dataset.attack||state.group;state.group=group;AudioDirector.play((/Hammer|Mace|Claymore|Greatsword|Axe/i.test(state.weapon)?'swingHeavy':'swingLight'),{damage:/Hammer|Mace|Claymore|Greatsword|Axe/i.test(state.weapon)?42:22});}const weapon=e.target.closest?.('[data-lab-action="nextWeapon"]');if(weapon)setTimeout(readWeapon,120);},true);const weaponSel=doc.getElementById('combatWeaponSelect');if(weaponSel){weaponSel.addEventListener('change',()=>setTimeout(readWeapon,80));readWeapon();}const meta=doc.getElementById('dummyMeta');if(meta){new MutationObserver(()=>readDummy(meta.textContent||'')).observe(meta,{childList:true,characterData:true,subtree:true});readDummy(meta.textContent||'');}}
function readWeapon(){let doc=frame.contentDocument;if(!doc)return;const sel=doc.getElementById('combatWeaponSelect');if(sel){state.weapon=sel.options[sel.selectedIndex]?.textContent?.replace(/\s*\(.+\)$/,'')||state.weapon;$('log').textContent=`Weapon: ${state.weapon}`;}}
function readDummy(txt){if(!txt||txt===state.lastDummy)return;state.lastDummy=txt;const dmg=(txt.match(/(\d+) dmg/)||[])[1];if(/shattered/i.test(txt)){state.surge=clamp(state.surge+.18,0,1);AudioDirector.play('kill',{damage:Number(dmg)||70,kill:true});}else if(dmg){const n=Number(dmg);state.surge=clamp(state.surge+n/520,0,1);AudioDirector.play(n>=34?'hitHeavy':'hitLight',{damage:n});}}
frame.addEventListener('load',()=>setTimeout(hookLab,350));document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{const v=b.dataset.test;if(v==='hurt'){state.damage=clamp(state.damage+.18,0,1);$('damage').value=Math.round(state.damage*100);sync()}if(v==='kill')state.surge=clamp(state.surge+.2,0,1);AudioDirector.play(v,{damage:v==='kill'?70:v.includes('Heavy')?52:24,kill:v==='kill'});});
</script>
</body>
</html>
