<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Stone Wanderer Lab + Red Toll Greatsword + Audio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#eef6ff;font-family:system-ui,Segoe UI,Arial,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070d}.shell{position:fixed;z-index:30;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:min(430px,calc(100vw - 20px));border:1px solid rgba(255,218,143,.32);border-radius:18px;background:rgba(9,10,18,.84);box-shadow:0 18px 55px #0009;backdrop-filter:blur(10px);overflow:hidden}.shell.collapsed .body{display:none}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.10)}.head h1{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#ffd18d}.head button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#eef6ff;border-radius:11px;padding:7px 9px;font-weight:900}.body{display:grid;gap:9px;padding:11px 12px 12px}.tog{display:flex;align-items:center;gap:8px;font-size:12px;color:#aab3c5}.audioRow{display:grid;grid-template-columns:88px 1fr 40px;gap:8px;align-items:center;font-size:12px;color:#aab3c5}.audioRow input{width:100%;accent-color:#ffd18d}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.grid button{min-height:38px;border-radius:12px;border:1px solid rgba(255,218,143,.28);background:rgba(14,18,31,.82);color:#eef6ff;font-weight:900}.log{min-height:30px;font-size:12px;line-height:1.35;color:#ffe6b8}.links{display:flex;gap:7px;flex-wrap:wrap}.links a{color:#eef6ff;text-decoration:none;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);padding:6px 9px;font-size:12px;font-weight:800}.hint{font-size:11px;line-height:1.3;color:#9aa7bf}@media(max-width:740px){.shell{left:8px;right:8px;width:auto}.links,.hint{display:none}.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<iframe id="labFrame" title="Stone Wanderer Stance Chain Lab Core"></iframe>
<section class="shell collapsed" id="shell">
  <div class="head"><h1>Red Toll + Audio</h1><button id="collapseBtn">+</button></div>
  <div class="body">
    <label class="tog"><input id="audioEnabled" type="checkbox" checked> audio enabled — hooks real attack starts</label>
    <label class="audioRow"><span>Beast mix</span><input id="audioBeast" type="range" min="0" max="100" value="55"><b id="audioBeastOut">55</b></label>
    <label class="audioRow"><span>Grit</span><input id="audioGrit" type="range" min="0" max="100" value="100"><b id="audioGritOut">100</b></label>
    <label class="audioRow"><span>Damage</span><input id="audioDamage" type="range" min="0" max="100" value="0"><b id="audioDamageOut">0</b></label>
    <div class="grid"><button data-test="swingLight">Swing</button><button data-test="hitLight">Hit</button><button data-test="swingHeavy">Heavy</button><button data-test="kill">Kill</button><button data-test="hurt">Hurt</button></div>
    <div class="log" id="log">Loading Stone Lab…</div>
    <div class="hint">Modules: <code>src/weapons.js</code>, <code>src/combat-audio.js</code>, and <code>src/lab-modes.js</code>.</div>
    <div class="links"><a href="reference/stone-wanderer-stance-chain-lab-core.html">Reference core</a><a href="reference/stone-wanderer-individual-move-test.html">Old move test</a><a href="reference/sound-foundry-retro-beasts.html">Sound Foundry</a></div>
  </div>
</section>
<script type="module">
import { STONE_WEAPON_ORDER, cloneWeaponDefinitions, createRedTollGreatswordCorePatch } from './src/weapons.js';
import { installCombatAudioDirector } from './src/combat-audio.js';
import { applyLabModeCorePatch, installLabModeChrome } from './src/lab-modes.js';

const frame=document.getElementById('labFrame');
const log=document.getElementById('log');
const CORE_FILE='reference/stone-wanderer-stance-chain-lab-core.html';
const UI=`    <div class="section">Red Toll Sword Tuning</div>
    <div class="hint">Use Greatsword. Weapon definitions are sourced from <code>src/weapons.js</code>; Red Toll is the greatsword visual variant for this lab. Greatsword reach is still 30% longer through the procedural weapon length, so the visible blade and hit zones grow together. Rotation controls tune the red edge per attack family.</div>
    <label class="row"><span>Global rot</span><input id="rtRotGlobal" type="range" min="-180" max="180" step="1" value="180" /><span class="readout" id="rtRotGlobalReadout">180°</span></label>
    <label class="row"><span>Vertical rot</span><input id="rtRotVertical" type="range" min="-180" max="180" step="1" value="90" /><span class="readout" id="rtRotVerticalReadout">90°</span></label>
    <label class="row"><span>Horizontal rot</span><input id="rtRotHorizontal" type="range" min="-180" max="180" step="1" value="0" /><span class="readout" id="rtRotHorizontalReadout">0°</span></label>
    <label class="row"><span>Thrust rot</span><input id="rtRotStab" type="range" min="-180" max="180" step="1" value="0" /><span class="readout" id="rtRotStabReadout">0°</span></label>
`;
const INJECT=createRedTollGreatswordCorePatch();
installCombatAudioDirector({
  frame,
  log,
  controls:{
    enabled:document.getElementById('audioEnabled'),
    beast:document.getElementById('audioBeast'),
    grit:document.getElementById('audioGrit'),
    damage:document.getElementById('audioDamage'),
    beastOut:document.getElementById('audioBeastOut'),
    gritOut:document.getElementById('audioGritOut'),
    damageOut:document.getElementById('audioDamageOut'),
    testButtons:document.querySelectorAll('[data-test]')
  }
});
installLabModeChrome({frame});
function mustPatch(html, needle, replacement, label){
  if(!html.includes(needle)) throw new Error('Patch target not found: '+label);
  return html.replace(needle,replacement);
}
function injectWeaponDefinitions(html){
  const script=`<script>\nwindow.__STONE_WEAPON_ORDER__=${JSON.stringify(STONE_WEAPON_ORDER)};\nwindow.__STONE_WEAPONS__=${JSON.stringify(cloneWeaponDefinitions())};\n<\/script>\n`;
  return mustPatch(html,'<script type="module">',script+'<script type="module">','weapon module globals');
}
function patchCore(html){
  html=injectWeaponDefinitions(html);
  const tuningNeedle='    <label class="row short">\n      <span>Attack lock</span>';
  html=mustPatch(html,tuningNeedle,UI+tuningNeedle,'Red Toll tuning panel');
  html=mustPatch(html,'function updateWeaponDynamicVisual(time=0,dt=0){',INJECT+'\nfunction updateWeaponDynamicVisual(time=0,dt=0){\n  rtApply();','weapon dynamic visual hook');
  const attackAudioNeedle='combatState.lastAttackLabel=att.label; aimState.lastSwing=att.label;';
  const attackAudioHook=`${attackAudioNeedle}\n  try{ window.parent.__stoneCombatAudio?.onAttackStart?.({key,group:combatState.attackGroup,label:att.label,weapon:currentWeapon().label}); }catch(e){}`;
  html=mustPatch(html,attackAudioNeedle,attackAudioHook,'combat audio attack-start hook');
  html=applyLabModeCorePatch(html);
  html=html.replace('Stone Wanderer loaded. Dungeon size now scales the room; zoom stays readable far out.','Red Toll greatsword branch loaded. Weapon definitions, combat audio, and lab modes are sourced from src modules.');
  return html;
}
async function load(){
  try{
    log.textContent='Loading core, weapon definitions module, combat audio, and lab modes…';
    const r=await fetch(CORE_FILE,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    frame.srcdoc=patchCore(await r.text());
    log.textContent='Patch loaded. Weapon definitions are sourced only from src/weapons.js. Use Lab Mode inside the Stone panel.';
  }catch(e){
    log.textContent='Patch failed: '+(e&&e.message?e.message:e);
    frame.src=CORE_FILE;
  }
}
load();
document.getElementById('collapseBtn').onclick=()=>{const s=document.getElementById('shell');s.classList.toggle('collapsed');document.getElementById('collapseBtn').textContent=s.classList.contains('collapsed')?'+':'−';};
</script>
</body>
</html>
