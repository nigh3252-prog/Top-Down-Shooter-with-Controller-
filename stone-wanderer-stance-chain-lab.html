<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Stone Wanderer Lab + Red Toll Greatsword</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#eef6ff;font-family:system-ui,Segoe UI,Arial,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070d}.shell{position:fixed;z-index:30;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:min(420px,calc(100vw - 20px));border:1px solid rgba(255,218,143,.32);border-radius:18px;background:rgba(9,10,18,.84);box-shadow:0 18px 55px #0009;backdrop-filter:blur(10px);overflow:hidden}.shell.collapsed .body{display:none}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.10)}.head h1{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#ffd18d}.head button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#eef6ff;border-radius:11px;padding:7px 9px;font-weight:900}.body{display:grid;gap:9px;padding:11px 12px 12px}.log{font-size:12px;line-height:1.35;color:#ffe6b8}.links a{color:#eef6ff;text-decoration:none;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);padding:6px 9px;font-size:12px;font-weight:800}@media(max-width:740px){.shell{left:8px;right:8px;width:auto}}
</style>
</head>
<body>
<iframe id="labFrame" title="Stone Wanderer Stance Chain Lab Core"></iframe>
<section class="shell collapsed" id="shell"><div class="head"><h1>Red Toll Patch</h1><button id="collapseBtn">+</button></div><div class="body"><div class="log" id="log">Loading Stone Lab…</div><div class="links"><a href="stone-wanderer-stance-chain-lab-core.html">Raw core</a></div></div></section>
<script type="module">
import { createRedTollGreatswordCorePatch } from './src/weapons.js';

const frame=document.getElementById('labFrame');
const log=document.getElementById('log');
const CORE_FILE='stone-wanderer-stance-chain-lab-core.html';
const UI=`    <div class="section">Red Toll Sword Tuning</div>
    <div class="hint">Use Greatsword. The Red Toll visual variant now lives in <code>src/weapons.js</code>. Greatsword reach is still 30% longer through the procedural weapon length, so the visible blade and hit zones grow together. Rotation controls tune the red edge per attack family.</div>
    <label class="row"><span>Global rot</span><input id="rtRotGlobal" type="range" min="-180" max="180" step="1" value="180" /><span class="readout" id="rtRotGlobalReadout">180°</span></label>
    <label class="row"><span>Vertical rot</span><input id="rtRotVertical" type="range" min="-180" max="180" step="1" value="90" /><span class="readout" id="rtRotVerticalReadout">90°</span></label>
    <label class="row"><span>Horizontal rot</span><input id="rtRotHorizontal" type="range" min="-180" max="180" step="1" value="0" /><span class="readout" id="rtRotHorizontalReadout">0°</span></label>
    <label class="row"><span>Thrust rot</span><input id="rtRotStab" type="range" min="-180" max="180" step="1" value="0" /><span class="readout" id="rtRotStabReadout">0°</span></label>
`;
const INJECT=createRedTollGreatswordCorePatch();
function mustPatch(html, needle, replacement, label){
  if(!html.includes(needle)) throw new Error('Patch target not found: '+label);
  return html.replace(needle,replacement);
}
function patchCore(html){
  const tuningNeedle='    <label class="row short">\n      <span>Attack lock</span>';
  html=mustPatch(html,tuningNeedle,UI+tuningNeedle,'Red Toll tuning panel');
  html=mustPatch(html,'function updateWeaponDynamicVisual(time=0,dt=0){',INJECT+'\nfunction updateWeaponDynamicVisual(time=0,dt=0){\n  rtApply();','weapon dynamic visual hook');
  html=html.replace('Stone Wanderer loaded. Dungeon size now scales the room; zoom stays readable far out.','Red Toll greatsword branch loaded. Greatsword visual code is sourced from src/weapons.js.');
  return html;
}
async function load(){
  try{
    log.textContent='Loading core and applying Red Toll weapon module…';
    const r=await fetch(CORE_FILE,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    frame.srcdoc=patchCore(await r.text());
    log.textContent='Patch loaded from src/weapons.js. Open the main panel, choose Greatsword, and use Red Toll Sword Tuning.';
  }catch(e){
    log.textContent='Patch failed: '+(e&&e.message?e.message:e);
    frame.src=CORE_FILE;
  }
}
load();
document.getElementById('collapseBtn').onclick=()=>{const s=document.getElementById('shell');s.classList.toggle('collapsed');document.getElementById('collapseBtn').textContent=s.classList.contains('collapsed')?'+':'−';};
</script>
</body>
</html>
