<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Stone Wanderer Move Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#eef6ff;font-family:system-ui,Segoe UI,Arial,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070d}
</style>
</head>
<body>
<iframe id="labFrame" src="stone-wanderer-stance-chain-lab-core.html" title="Stone Wanderer Move Test Core"></iframe>
<script>
'use strict';
const frame=document.getElementById('labFrame');
const MODE_KEY='stoneWandererMoveTestMode.v1';
const RATINGS_KEY='stoneWandererIndividualMoveRatings.v1';
const state={mode:localStorage.getItem(MODE_KEY)||'stance',ratings:{},lastMove:null,gpPrev:{},weapon:'Longsword',group:'vertical',lastDummy:'',lastAttackToken:'',surge:0};
const groupInfo={vertical:{label:'Vertical',button:'attackV',readout:'varV',pad:'□'},horizontal:{label:'Horizontal',button:'attackH',readout:'varH',pad:'△'},stab:{label:'Thrust',button:'attackS',readout:'varS',pad:'○'}};
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function doc(){try{return frame.contentDocument}catch(e){return null}}
function win(){try{return frame.contentWindow}catch(e){return null}}
function loadRatings(){try{state.ratings=JSON.parse(localStorage.getItem(RATINGS_KEY)||'{}')||{};}catch(e){state.ratings={};}}
function saveRatings(){try{localStorage.setItem(RATINGS_KEY,JSON.stringify(state.ratings));}catch(e){}}
function readWeapon(){const d=doc();const sel=d?.getElementById('combatWeaponSelect');if(sel)state.weapon=sel.options?.[sel.selectedIndex]?.textContent?.replace(/\s*\(.+\)$/,'')||state.weapon;return state.weapon;}
function parseNext(group){const d=doc();const text=d?.getElementById(groupInfo[group].readout)?.textContent||'';const m=text.match(/(\d+)\/(\d+)/);return {index:m?Number(m[1]):null,total:m?Number(m[2]):null};}
function parseCurrentAttack(){const d=doc();const meta=d?.getElementById('combatMeta')?.textContent||'';const m=meta.match(/Current:\s*([^(.]+?)(?:\s*—\s*([^(.]+?))?\s*\(([^)]+)\)/i);return {meta,label:m?(m[1]||'').trim():'',detail:m?(m[2]||'').trim():'',group:m?(m[3]||'').trim():'',idle:/Current:\s*idle/i.test(meta)};}
function dispatchPress(el){if(!el)return false;const w=win()||window;try{el.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:1,pointerType:'mouse',isPrimary:true}));}catch(e){el.dispatchEvent(new MouseEvent('pointerdown',{bubbles:true,cancelable:true}));}return true;}
function clickInCore(selector){const d=doc();return !!(d&&dispatchPress(d.querySelector(selector)));}
function ratingGlyph(v){return v==='up'?'👍':(v==='down'?'👎':'—');}
function ratingBadge(id){return `<span class="rating-badge">${ratingGlyph(state.ratings[id]?.rating||'')}</span>`;}
function countRatings(){const vals=Object.values(state.ratings);return {count:vals.length,up:vals.filter(r=>r.rating==='up').length,down:vals.filter(r=>r.rating==='down').length};}
function setMode(mode){state.mode=mode==='moves'?'moves':'stance';localStorage.setItem(MODE_KEY,state.mode);syncInjectedUI();}
function setButtonHTML(button,main,small){if(!button)return;button.innerHTML=small?`${main}<small>${small}</small>`:main;}
function syncInjectedUI(){const d=doc();if(!d)return;const sel=d.getElementById('moveTestModeSelect');if(sel&&sel.value!==state.mode)sel.value=state.mode;const isMoves=state.mode==='moves';d.querySelectorAll('[data-lab-action="attack"]').forEach(b=>setButtonHTML(b,isMoves?'□ Vertical':'□ Attack',isMoves?'next vertical':'next chain hit'));d.querySelectorAll('[data-lab-action="nextStance"]').forEach(b=>setButtonHTML(b,isMoves?'△ Horizontal':'△ Authored',isMoves?'next horizontal':'next stance'));d.querySelectorAll('[data-lab-action="randomStance"]').forEach(b=>setButtonHTML(b,isMoves?'○ Thrust':'○ Random',isMoves?'next thrust':'new chain'));const meta=d.getElementById('moveTestModeMeta');if(meta){if(isMoves){const c=countRatings();meta.innerHTML=`<strong>Individual Moves</strong><br>□ Vertical · △ Horizontal · ○ Thrust · ✕ Weapon. LB/RB rate the specific attack that just played.<br><span class="rating-badge">${c.up} 👍</span><span class="rating-badge">${c.down} 👎</span><span class="rating-badge">${c.count} rated</span>`;}else{meta.innerHTML='<strong>Stance Cards</strong><br>□ Attack plays the next chain hit. △ cycles authored stances. ○ creates a random stance. LB/RB rate the current stance trial.';}}updateMoveRatingMeta();}
function updateMoveRatingMeta(){const d=doc();if(!d)return;const el=d.getElementById('moveRatingMeta');if(!el)return;if(state.mode!=='moves'){el.style.display='none';return;}el.style.display='block';if(!state.lastMove){el.textContent='Individual move rating: play a vertical, horizontal, or thrust attack, then use LB/RB.';return;}const last=state.lastMove;el.innerHTML=`Last move: <strong>${last.label}</strong> · ${groupInfo[last.group].label} ${last.index||'?'}${last.total?'/'+last.total:''} · ${last.weapon} ${ratingBadge(last.id)}`;}
function installModeControls(){const d=doc();if(!d||d.getElementById('moveTestModeSelect'))return;const combatMeta=d.getElementById('combatMeta');if(!combatMeta)return;combatMeta.insertAdjacentHTML('afterend',`<div class="section">Test Mode</div><label class="row short"><span>Mode</span><select id="moveTestModeSelect" aria-label="Move test mode"><option value="stance">Stance Cards</option><option value="moves">Individual Moves</option></select></label><div class="combat-meta lab-meta" id="moveTestModeMeta"></div><div class="combat-meta lab-meta" id="moveRatingMeta"></div>`);const sel=d.getElementById('moveTestModeSelect');sel.value=state.mode;sel.addEventListener('change',e=>setMode(e.target.value));syncInjectedUI();}
function capturePlayedMove(group,next){setTimeout(()=>{const cur=parseCurrentAttack();const info=groupInfo[group];const idx=next.index||null;const label=cur.label||`${info.label} ${idx||'?'}`;const id=`${group}:${idx||label}`;state.lastMove={id,group,index:idx,total:next.total||null,label,weapon:readWeapon(),playedAt:new Date().toISOString()};updateMoveRatingMeta();},90);}
function playMoveFamily(group){const next=parseNext(group);const ok=clickInCore('#'+groupInfo[group].button);if(ok)capturePlayedMove(group,next);return ok;}
function rateMove(value){if(state.mode!=='moves'){clickInCore(`[data-lab-action="${value==='up'?'rateUp':value==='down'?'rateDown':'clearRating'}"]`);return;}if(!state.lastMove){updateMoveRatingMeta();return;}if(value){state.ratings[state.lastMove.id]={...state.lastMove,rating:value,updatedAt:new Date().toISOString()};}else{delete state.ratings[state.lastMove.id];}saveRatings();syncInjectedUI();}
function handleModeAction(action){if(state.mode!=='moves'){clickInCore(`[data-lab-action="${action}"]`);return;}if(action==='attack')playMoveFamily('vertical');else if(action==='nextStance')playMoveFamily('horizontal');else if(action==='randomStance')playMoveFamily('stab');else if(action==='rateDown')rateMove('down');else if(action==='rateUp')rateMove('up');else if(action==='clearRating')rateMove('');else clickInCore(`[data-lab-action="${action}"]`);}
function onCorePointerDown(e){const attackBtn=e.target.closest?.('[data-attack]');if(attackBtn){const group=attackBtn.dataset.attack;if(groupInfo[group]){const next=parseNext(group);capturePlayedMove(group,next);}return;}const labBtn=e.target.closest?.('[data-lab-action]');if(!labBtn)return;const action=labBtn.dataset.labAction;if(state.mode==='moves'&&['attack','nextStance','randomStance','rateDown','rateUp','clearRating'].includes(action)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();handleModeAction(action);}}
function installPointerRemap(){const d=doc();if(!d||d.__moveModePointerRemap)return;d.__moveModePointerRemap=true;d.addEventListener('pointerdown',onCorePointerDown,true);}
function proxyIframeGamepads(){const w=win();if(!w||w.__moveModeGamepadProxy)return;try{Object.defineProperty(w.navigator,'getGamepads',{configurable:true,value:()=>{const pads=navigator.getGamepads?navigator.getGamepads():[];return Array.from(pads).map(gp=>{if(!gp)return null;const buttons=Array.from(gp.buttons||[]).map((b,i)=>{const clear=[0,1,2,3,4,5].includes(i);return {pressed:clear?false:!!b.pressed,touched:clear?false:!!b.touched,value:clear?0:Number(b.value)||0};});return {id:gp.id,index:gp.index,connected:gp.connected,mapping:gp.mapping,timestamp:gp.timestamp,axes:Array.from(gp.axes||[]),buttons};});}});w.__moveModeGamepadProxy=true;}catch(e){}}
function gpPressed(gp,i){const down=!!gp.buttons[i]?.pressed;const key=gp.index+'_'+i;const was=!!state.gpPrev[key];state.gpPrev[key]=down;return down&&!was;}
function pollGamepads(){proxyIframeGamepads();const pads=navigator.getGamepads?navigator.getGamepads():[];for(const gp of pads){if(!gp)continue;if(gpPressed(gp,2))handleModeAction('attack');if(gpPressed(gp,3))handleModeAction('nextStance');if(gpPressed(gp,1))handleModeAction('randomStance');if(gpPressed(gp,0))handleModeAction('nextWeapon');if(gpPressed(gp,4))handleModeAction('rateDown');if(gpPressed(gp,5))handleModeAction('rateUp');break;}requestAnimationFrame(pollGamepads);}
function isHeavyWeapon(){return /Hammer|Mace|Claymore|Greatsword|Axe/i.test(state.weapon);}
const AudioDirector=(()=>{let AC,master,noiseBuf,lastAt=0;function init(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.70;const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;comp.attack.value=.003;comp.release.value=.16;master.connect(comp).connect(AC.destination);noiseBuf=AC.createBuffer(1,AC.sampleRate*1.2,AC.sampleRate);const data=noiseBuf.getChannelData(0);let seed=9119;for(let i=0;i<data.length;i++){seed=seed*16807%2147483647;data[i]=seed/1073741823-1;}}function env(g,t,p,d,a=.004){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,p),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);}function tone(type,f0,f1,dur,g,delay=0){init();const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(20,f0),t);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur*.9);env(gn,t,g,dur);o.connect(gn).connect(master);o.start(t);o.stop(t+dur+.04);}function noise(filter,f0,f1,dur,g,delay=0,q=1.5){init();const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=noiseBuf;s.playbackRate.value=.75+Math.random()*.55;f.type=filter;f.Q.value=q;f.frequency.setValueAtTime(Math.max(25,f0),t);if(f1)f.frequency.exponentialRampToValueAtTime(Math.max(25,f1),t+dur*.9);env(gn,t,g,dur,.002);s.connect(f).connect(gn).connect(master);s.start(t,Math.random()*.45);s.stop(t+dur+.05);}function play(event,ctx={}){init();if(AC.state==='suspended')AC.resume();const now=performance.now();if(now-lastAt<22&&event!=='hurt')return;lastAt=now;const damage=Number(ctx.damage)||0, beast=clamp(state.surge+damage/420,0,1);if(event==='swingLight'){const thrust=state.group==='stab';tone('triangle',thrust?155:178,thrust?92:105,.12,.07);noise('bandpass',thrust?1250:820,thrust?2700:2200,thrust?.10:.14,.17,.01,thrust?3.4:2.1);if(beast>.45)tone('sawtooth',160,78,.16,.06*beast,.01);}else if(event==='swingHeavy'){tone('triangle',132,58,.28,.14);noise('bandpass',330,1500,.29,.32,.01,1.6);tone('square',165,90,.13,.05,.04);if(beast>.35)tone('sawtooth',90,42,.42,.08*beast,.02);}else if(event==='hitLight'){noise('highpass',2800,1180,.055,.32,0,1);tone('square',390,185,.075,.10);noise('bandpass',850,220,.11,.13,0,2.3);}else if(event==='hitHeavy'){tone('sine',145,39,.22,.38);noise('lowpass',680,110,.20,.42,0,1);noise('bandpass',1600,260,.13,.25,.015,3);}else if(event==='kill'){tone('sine',170,36,.30,.48);noise('lowpass',760,80,.27,.46,0,1.1);tone('square',310,110,.09,.08,.02);}else if(event==='hurt'){tone('sawtooth',220,70,.20,.16);noise('bandpass',520,140,.22,.22,0,2.5);}}return{play,init};})();
function watchCombatMeta(){const d=doc();const meta=d?.getElementById('combatMeta');if(!meta||meta.__audioWatch)return;meta.__audioWatch=true;const read=()=>{readWeapon();const cur=parseCurrentAttack();if(cur.group)state.group=cur.group;if(cur.idle){state.lastAttackToken='';return;}if(cur.label){const token=`${cur.label}|${cur.group}|${cur.meta}`;if(token!==state.lastAttackToken){state.lastAttackToken=token;AudioDirector.play(isHeavyWeapon()?'swingHeavy':'swingLight',{damage:isHeavyWeapon()?42:22});}}};new MutationObserver(read).observe(meta,{childList:true,characterData:true,subtree:true});read();}
function readDummy(txt){if(!txt||txt===state.lastDummy)return;state.lastDummy=txt;const dmg=(txt.match(/(\d+) dmg/)||[])[1];if(/shattered/i.test(txt)){state.surge=clamp(state.surge+.18,0,1);AudioDirector.play('kill',{damage:Number(dmg)||70,kill:true});}else if(dmg){const n=Number(dmg);state.surge=clamp(state.surge+n/520,0,1);AudioDirector.play(n>=34?'hitHeavy':'hitLight',{damage:n});}}
function watchDummy(){const d=doc();const meta=d?.getElementById('dummyMeta');if(!meta||meta.__audioWatch)return;meta.__audioWatch=true;new MutationObserver(()=>readDummy(meta.textContent||'')).observe(meta,{childList:true,characterData:true,subtree:true});readDummy(meta.textContent||'');}
function install(){installModeControls();installPointerRemap();proxyIframeGamepads();watchCombatMeta();watchDummy();const d=doc();const weaponSel=d?.getElementById('combatWeaponSelect');if(weaponSel&&!weaponSel.__audioWeaponWatch){weaponSel.__audioWeaponWatch=true;weaponSel.addEventListener('change',()=>setTimeout(readWeapon,80));readWeapon();}syncInjectedUI();}
frame.addEventListener('load',()=>setTimeout(install,350));
loadRatings();pollGamepads();setInterval(install,1000);
</script>
</body>
</html>
