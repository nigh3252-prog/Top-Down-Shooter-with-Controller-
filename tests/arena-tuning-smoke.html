<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arena Tuning Smoke Test</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"}}
</script>
</head>
<body>
<output id="status">starting</output>
<script type="module">
import * as THREE from 'three';
import { createArenaEnemySystem } from '../src/arena-enemies.js';
import { FUSION_ATTACKS } from '../src/fusion-enemies.js';

function makeSystem({ aggression, count = 1, kind = 'phx' }){
  const worldRoot = new THREE.Group();
  const system = createArenaEnemySystem({ THREE, worldRoot, arenaRadius:18 });
  system.setWaveSize(count);
  system.setSpawnKind(kind);
  system.setAggression(aggression);
  system.setDirectorMode('chaos');
  system.reset();
  return system;
}

function countAttacks(system, seconds){
  const dt = 1/60;
  let attacks = 0;
  const previous = new Map();
  system.enemies.forEach((enemy, i) => {
    enemy.x = i * .04;
    enemy.z = 3 + i * .04;
    enemy.cooldown = 0;
    previous.set(enemy, enemy.state);
  });
  for(let t = 0; t < seconds; t += dt){
    system.update(dt, { x:0, z:0, invulnerable:true });
    system.enemies.forEach(enemy => {
      if(enemy.state === 'windup' && previous.get(enemy) !== 'windup') attacks++;
      previous.set(enemy, enemy.state);
    });
  }
  return attacks;
}

const low = makeSystem({ aggression:.25 });
const high = makeSystem({ aggression:3 });
const lowAttacks = countAttacks(low, 20);
const highAttacks = countAttacks(high, 20);

const goblins = makeSystem({ aggression:1, count:10, kind:'goblins' });
const goblinKinds = ['grunt','dagger','mace','rock','captain'];

function gaitAdvance(speedScale){
  const system = makeSystem({ aggression:1, kind:'lion' });
  system.setSpeedScale(speedScale);
  const enemy = system.enemies[0];
  enemy.x = 0; enemy.z = 12; enemy.cooldown = 999;
  const start = enemy.fusionVisual.gaitPhase;
  for(let t = 0; t < 3; t += 1/60) system.update(1/60, { x:0, z:0, invulnerable:true });
  return enemy.fusionVisual.gaitPhase - start;
}
const slowGait = gaitAdvance(.25);
const fastGait = gaitAdvance(1);

const croc = makeSystem({ aggression:1, kind:'croc' });
const crocEnemy = croc.enemies[0];
crocEnemy.x = 0; crocEnemy.z = 4.2; crocEnemy.facing = { x:0, z:-1 }; crocEnemy.cooldown = 0;
croc.update(1/60, { x:0, z:0, invulnerable:true });

const sun = makeSystem({ aggression:1, kind:'sun' }).enemies[0];
const stiltSystem = makeSystem({ aggression:1, kind:'stilt' });
const stilt = stiltSystem.enemies[0];
stilt.attack = FUSION_ATTACKS.stiltStomp; stilt.state = 'recovery'; stilt.stateTime = 0; stilt.recovery = 1;
stiltSystem.update(1/60, { x:0, z:0, invulnerable:true });

const spacing = makeSystem({ aggression:3, count:6, kind:'lion' });
spacing.enemies.forEach((enemy, i) => { enemy.x = (i%2)*.03; enemy.z = 3 + Math.floor(i/2)*.03; });
for(let t = 0; t < 2; t += 1/60) spacing.update(1/60, { x:0, z:0, invulnerable:true });
let minDistance = Infinity;
for(let i = 0; i < spacing.enemies.length; i++){
  for(let j = i+1; j < spacing.enemies.length; j++){
    minDistance = Math.min(minDistance, Math.hypot(spacing.enemies[i].x-spacing.enemies[j].x, spacing.enemies[i].z-spacing.enemies[j].z));
  }
}

const result = {
  allSingleKind:spacing.enemies.every(enemy => enemy.kind === 'lion'),
  goblinsOnly:goblins.enemies.every(enemy => goblinKinds.includes(enemy.kind)),
  aggression:{ low:lowAttacks, high:highAttacks, increased:highAttacks > lowAttacks },
  gait:{ slow:Number(slowGait.toFixed(3)), fast:Number(fastGait.toFixed(3)), speedSynced:fastGait > slowGait*1.7 },
  scale:{ sun:sun.visualScale, croc:crocEnemy.visualScale, stilt:stilt.visualScale },
  stiltSoftCounter:stilt.meleeAccessible && stilt.currentTargetScale === 1,
  crocMouthAttack:crocEnemy.state === 'windup' && Math.hypot(crocEnemy.x,crocEnemy.z) > 3.5,
  spacing:{ minDistance:Number(minDistance.toFixed(3)), separated:minDistance > 3 }
};
document.getElementById('status').textContent = JSON.stringify(result);
</script>
</body>
</html>
