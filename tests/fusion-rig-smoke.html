<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fusion Rig Smoke Test</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172329}canvas{display:block}#status{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"}}
</script>
</head>
<body>
<output id="status">starting</output>
<script>
window.__fusionErrors=[];
addEventListener('error', event => window.__fusionErrors.push(event.error?.stack || event.message));
addEventListener('unhandledrejection', event => window.__fusionErrors.push(event.reason?.stack || String(event.reason)));
</script>
<script type="module">
import * as THREE from 'three';
import { installFusionEnemyRig } from '../src/fusion-enemy-rig.js';
import { FUSION_ARCHETYPES, FUSION_ENEMY_IDS } from '../src/fusion-enemies.js';
import { createArenaEnemySystem } from '../src/arena-enemies.js';

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x172329);
scene.add(new THREE.HemisphereLight(0xe8f4ff, 0x303820, 1.2));
const key = new THREE.DirectionalLight(0xffe4bb, 1.6); key.position.set(8,14,10); scene.add(key);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(48,28), new THREE.MeshStandardMaterial({ color:0x627267, roughness:1 }));
ground.rotation.x = -Math.PI/2; scene.add(ground);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 100);
camera.position.set(0,18,32); camera.lookAt(0,4,0);
const fusion = installFusionEnemyRig(THREE);
const handles = [];
const errors = [];
FUSION_ENEMY_IDS.forEach((kind, i) => {
  try {
    const handle = fusion.create(kind);
    const mount = new THREE.Group();
    mount.position.x = (i%5-2)*7.5;
    mount.position.z = (Math.floor(i/5)-.5)*10;
    mount.add(handle.model.group);
    scene.add(mount);
    handle.mount = mount;
    handles.push(handle);
  } catch(error) {
    errors.push({ kind, message:error.message });
  }
});

const clock = new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;
  handles.forEach(handle => fusion.update(handle, {
    state:'idle', visualGroundSpeed:1, maxGroundSpeed:4, speed:4
  }, dt, time, FUSION_ARCHETYPES[handle.kind].visualScale));
  if(typeof enemySystem !== 'undefined') enemySystem.update(dt, { x:0, z:0, invulnerable:true });
  renderer.render(scene,camera);
}
window.__fusionSmoke = { count:handles.length, kinds:FUSION_ENEMY_IDS.slice(), errors, handles };
const arenaWorld = new THREE.Group(); scene.add(arenaWorld);
const enemySystem = createArenaEnemySystem({ THREE, worldRoot:arenaWorld, arenaRadius:18 });
enemySystem.group.visible = false;
document.getElementById('status').textContent = JSON.stringify({
  direct:handles.length,
  directErrors:errors,
  arena:enemySystem.enemies.length,
  arenaKinds:enemySystem.enemies.map(enemy => enemy.kind),
  arenaFusionRigs:enemySystem.enemies.filter(enemy => !!enemy.fusionVisual).length
});
frame();
</script>
</body>
</html>
