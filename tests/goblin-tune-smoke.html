<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goblin Tune Visual Smoke Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171914;color:#f2ead8;font:14px system-ui}
#status{position:fixed;left:12px;bottom:12px;z-index:2;padding:8px 10px;background:#171914d9;border:1px solid #7f866e;border-radius:4px}
canvas{display:block}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"}}
</script>
</head>
<body>
<output id="status">starting</output>
<script type="module">
import * as THREE from 'three';
import { createArenaEnemySystem } from '../src/arena-enemies.js';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x242820);
scene.add(new THREE.HemisphereLight(0xfff1d0,0x26302a,2.2));
const sun=new THREE.DirectionalLight(0xffd8aa,3.2); sun.position.set(-5,10,-6); sun.castShadow=true; scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,18),new THREE.MeshStandardMaterial({color:0x59604d,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const worldRoot=new THREE.Group(); scene.add(worldRoot);
const system=createArenaEnemySystem({THREE,worldRoot,arenaRadius:18});
system.setWaveSize(5); system.setSpawnKind('goblins'); system.setDirectorMode('oneAttacker'); system.reset();
system.enemies.forEach((enemy,i)=>{
  enemy.x=(i-2)*4.2; enemy.z=0; enemy.cooldown=999;
  enemy.facingAngle=Math.PI-.45; enemy.facing.x=Math.sin(enemy.facingAngle); enemy.facing.z=Math.cos(enemy.facingAngle);
  enemy.approachCooldown=i===0?0:99;
});
system.update(1/60,{x:-6.5,z:-7,invulnerable:true});
const rally=system.enemies.find(enemy=>!enemy.approachPermit);
rally.gesture='rally'; rally.gestureTime=.48; rally.gestureDuration=1.3; rally.rallyFacingAngle=Math.PI-.45;

const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);
camera.position.set(0,18,-25); camera.lookAt(0,2.5,0);
function resize(){
  renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

const kinds=system.enemies.map(enemy=>enemy.kind);
document.getElementById('status').textContent=JSON.stringify({kinds,roles:system.enemies.map(enemy=>enemy.role),weaponScales:system.enemies.map(enemy=>enemy.weaponScale),customWeapons:system.enemies.filter(enemy=>enemy.weaponRoot.userData.goblinWeaponKind).length,rally:rally.kind});
function frame(now){
  rally.gestureTime=.48+Math.sin(now*.006)*.05;
  system.update(0,{x:-6.5,z:-7,invulnerable:true});
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
