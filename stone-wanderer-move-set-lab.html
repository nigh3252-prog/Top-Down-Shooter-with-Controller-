<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Stone Wanderer Move Set Tester</title>
<style>
:root{color-scheme:dark;--bg:#05070d;--panel:rgba(9,13,22,.88);--line:rgba(255,255,255,.16);--text:#eef6ff;--muted:#9ca9bf;--blue:#8dd2ff;--gold:#f3ce79;--bad:#ff8d8d;--good:#9cffba}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070d}.shell{position:fixed;z-index:40;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:min(430px,calc(100vw - 20px));border:1px solid rgba(141,210,255,.26);border-radius:18px;background:var(--panel);box-shadow:0 18px 55px #000a;backdrop-filter:blur(10px);overflow:hidden}.shell.collapsed .body{display:none}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.10)}.head h1{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.head button,.mini{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--text);border-radius:11px;padding:7px 9px;font-weight:900}.body{display:grid;gap:10px;padding:11px 12px 12px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:7px}.seg button,.grid button{min-height:42px;border-radius:13px;border:1px solid rgba(141,210,255,.24);background:rgba(255,255,255,.055);color:var(--text);font-weight:900;touch-action:manipulation}.seg button.active{border-color:rgba(243,206,121,.66);background:rgba(243,206,121,.18)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.grid.rate{grid-template-columns:repeat(4,1fr)}.grid button.good{border-color:rgba(156,255,186,.34)}.grid button.bad{border-color:rgba(255,141,141,.34)}.meta{font-size:12px;line-height:1.38;color:var(--muted);padding:9px 10px;border:1px solid rgba(255,255,255,.10);border-radius:13px;background:rgba(255,255,255,.045)}.meta strong{color:var(--text)}.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:2px 7px;margin:2px 3px 2px 0;background:rgba(255,255,255,.06);color:var(--text);font-weight:900}.hint{font-size:12px;color:var(--muted);line-height:1.35}.links{display:flex;gap:7px;flex-wrap:wrap}.links a{color:var(--text);text-decoration:none;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);padding:6px 9px;font-size:12px;font-weight:800}@media(max-width:740px){.shell{left:8px;right:8px;width:auto}.hint,.links{display:none}.grid button{min-height:46px}}
</style>
</head>
<body>
<iframe id="labFrame" src="stone-wanderer-stance-chain-lab-core.html" title="Stone Wanderer Lab Core"></iframe>
<section class="shell" id="shell">
  <div class="head"><h1>Stone Move Tester</h1><button id="collapseBtn">−</button></div>
  <div class="body">
    <div class="seg" role="group" aria-label="Testing mode">
      <button id="modeStance" class="active" type="button">Stance Cards</button>
      <button id="modeMoves" type="button">Individual Moves</button>
    </div>
    <div class="meta" id="modeMeta">Loading Stone Lab…</div>
    <div class="grid">
      <button id="btnSquare" type="button">□ Attack<br><small>stance / vertical</small></button>
      <button id="btnTriangle" type="button">△ Stance<br><small>stance / horizontal</small></button>
      <button id="btnCircle" type="button">○ Random<br><small>random / thrust</small></button>
    </div>
    <div class="grid rate">
      <button id="btnCross" type="button">✕ Weapon</button>
      <button id="btnRateDown" class="bad" type="button">LB 👎</button>
      <button id="btnRateUp" class="good" type="button">RB 👍</button>
      <button id="btnClear" type="button">Clear</button>
    </div>
    <div class="meta" id="ratingMeta">No individual attack rated yet.</div>
    <div class="links"><a href="stone-wanderer-stance-chain-lab.html">Audio lab</a><a href="stone-wanderer-stance-chain-lab-core.html">Raw core</a><a href="#" id="downloadCsv">CSV</a><a href="#" id="downloadJson">JSON</a></div>
    <div class="hint">In Individual Moves mode: □ cycles vertical attacks, △ cycles horizontal attacks, and ○ cycles thrusts. LB/RB rate the specific attack that just played.</div>
  </div>
</section>
<script>
'use strict';
const $=id=>document.getElementById(id);
const frame=$('labFrame');
const STORE_KEY='stoneWandererIndividualMoveRatings.v1';
const state={mode:'stance',lastIndividual:null,ratings:{},gpPrev:{},hooked:false};
const groupMap={vertical:{button:'attackV',label:'Vertical',readout:'varV',buttonName:'□'},horizontal:{button:'attackH',label:'Horizontal',readout:'varH',buttonName:'△'},stab:{button:'attackS',label:'Thrust',readout:'varS',buttonName:'○'}};
function loadRatings(){try{state.ratings=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{};}catch(e){state.ratings={};}}
function saveRatings(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state.ratings));}catch(e){}}
function doc(){try{return frame.contentDocument}catch(e){return null}}
function win(){try{return frame.contentWindow}catch(e){return null}}
function dispatchPress(el){if(!el)return false;const w=win()||window;try{el.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:1,pointerType:'mouse',isPrimary:true}));}catch(e){el.dispatchEvent(new MouseEvent('pointerdown',{bubbles:true,cancelable:true}));}return true;}
function clickCore(selector){const d=doc();return !!(d&&dispatchPress(d.querySelector(selector)));}
function readWeapon(){const d=doc();const sel=d?.getElementById('combatWeaponSelect');return sel?.options?.[sel.selectedIndex]?.textContent?.replace(/\s*\(.+\)$/,'')||'Current weapon';}
function parseNext(group){const d=doc();const text=d?.getElementById(groupMap[group].readout)?.textContent||'';const m=text.match(/(\d+)\/(\d+)/);return {index:m?Number(m[1]):null,total:m?Number(m[2]):null,text};}
function parseCurrentAttack(){const d=doc();const meta=d?.getElementById('combatMeta')?.textContent||'';const m=meta.match(/Current:\s*([^(.]+?)(?:\s*—\s*([^(.]+?))?\s*\(([^)]+)\)/i);return {meta,label:m?(m[1]||'').trim():'',detail:m?(m[2]||'').trim():'',group:m?(m[3]||'').trim():''};}
function setMode(mode){state.mode=mode;$('modeStance').classList.toggle('active',mode==='stance');$('modeMoves').classList.toggle('active',mode==='moves');updateModeUI();}
function updateModeUI(){const stance=state.mode==='stance';$('btnSquare').innerHTML=stance?'□ Attack<br><small>next chain hit</small>':'□ Vertical<br><small>next vertical</small>';$('btnTriangle').innerHTML=stance?'△ Authored<br><small>next stance</small>':'△ Horizontal<br><small>next horizontal</small>';$('btnCircle').innerHTML=stance?'○ Random<br><small>new chain</small>':'○ Thrust<br><small>next thrust</small>';const count=Object.keys(state.ratings).length;const up=Object.values(state.ratings).filter(r=>r.rating==='up').length;const down=Object.values(state.ratings).filter(r=>r.rating==='down').length;$('modeMeta').innerHTML=stance?'<strong>Stance Cards mode</strong><br>Controller uses the existing stance-chain mapping: □ attack, △ authored stance, ○ random stance, ✕ weapon, LB/RB rate the stance trial.':'<strong>Individual Moves mode</strong><br>Controller remaps to raw move families: □ vertical, △ horizontal, ○ thrust. ✕ still cycles weapon. LB/RB rate the last specific attack. '+`<br><span class="pill">${up} 👍</span><span class="pill">${down} 👎</span><span class="pill">${count} rated</span>`;updateRatingUI();}
function attackIndividual(group){const next=parseNext(group);const ok=clickCore('#'+groupMap[group].button);if(!ok){$('modeMeta').textContent='Stone Lab is not ready yet.';return;}setTimeout(()=>{const cur=parseCurrentAttack();const label=cur.label||`${groupMap[group].label} ${next.index||'?'}`;const id=`${group}:${next.index||label}`;state.lastIndividual={id,group,index:next.index,total:next.total,label,weapon:readWeapon(),playedAt:new Date().toISOString()};$('ratingMeta').innerHTML=`Last individual attack: <strong>${groupMap[group].label} ${next.index||'?'}${next.total?'/'+next.total:''}</strong> · ${label} · ${readWeapon()} ${ratingPill(id)}`;updateModeUI();},90);}
function stanceAction(action){clickCore(`[data-lab-action="${action}"]`);if(action==='nextWeapon')setTimeout(updateModeUI,120);}
function primaryAction(kind){if(state.mode==='moves'){if(kind==='square')attackIndividual('vertical');else if(kind==='triangle')attackIndividual('horizontal');else if(kind==='circle')attackIndividual('stab');else if(kind==='cross')stanceAction('nextWeapon');return;}if(kind==='square')stanceAction('attack');else if(kind==='triangle')stanceAction('nextStance');else if(kind==='circle')stanceAction('randomStance');else if(kind==='cross')stanceAction('nextWeapon');}
function ratingPill(id){const r=state.ratings[id]?.rating||'';return r?`<span class="pill">${r==='up'?'👍':'👎'}</span>`:'<span class="pill">—</span>';}
function rate(value){if(state.mode==='stance'){stanceAction(value==='up'?'rateUp':value==='down'?'rateDown':'clearRating');return;}const last=state.lastIndividual;if(!last){$('ratingMeta').textContent='Play an individual attack first, then rate it.';return;}const row={...last,rating:value||'',updatedAt:new Date().toISOString()};if(value)state.ratings[last.id]=row;else delete state.ratings[last.id];saveRatings();updateModeUI();$('ratingMeta').innerHTML=`Rated <strong>${last.label}</strong> (${groupMap[last.group].label} ${last.index||'?'}${last.total?'/'+last.total:''}) as ${ratingPill(last.id)} · ${last.weapon}`;}
function updateRatingUI(){if(state.lastIndividual){const l=state.lastIndividual;$('ratingMeta').innerHTML=`Last individual attack: <strong>${l.label}</strong> · ${groupMap[l.group].label} ${l.index||'?'}${l.total?'/'+l.total:''} · ${l.weapon} ${ratingPill(l.id)}`;}}
function csvCell(v){const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function download(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);}
function downloadCsv(){const rows=[['id','group','index','total','label','weapon','rating','played_at','updated_at'],...Object.values(state.ratings).map(r=>[r.id,r.group,r.index,r.total,r.label,r.weapon,r.rating,r.playedAt,r.updatedAt])];download('stone-individual-move-ratings.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');}
function downloadJson(){download('stone-individual-move-ratings.json',JSON.stringify({exportedAt:new Date().toISOString(),ratings:Object.values(state.ratings)},null,2),'application/json');}
function disableIframeGamepad(){const w=win();if(!w||w.__moveSetGamepadMuted)return;try{Object.defineProperty(w.navigator,'getGamepads',{value:()=>[],configurable:true});w.__moveSetGamepadMuted=true;}catch(e){try{w.navigator.getGamepads=()=>[];w.__moveSetGamepadMuted=true;}catch(_){} }}
function gpPressed(gp,i){const down=!!gp.buttons[i]?.pressed;const key=gp.index+'_'+i;const was=!!state.gpPrev[key];state.gpPrev[key]=down;return down&&!was;}
function pollGamepads(){disableIframeGamepad();const pads=navigator.getGamepads?navigator.getGamepads():[];for(const gp of pads){if(!gp)continue;if(gpPressed(gp,2))primaryAction('square');if(gpPressed(gp,3))primaryAction('triangle');if(gpPressed(gp,1))primaryAction('circle');if(gpPressed(gp,0))primaryAction('cross');if(gpPressed(gp,4))rate('down');if(gpPressed(gp,5))rate('up');break;}requestAnimationFrame(pollGamepads);}
function hook(){disableIframeGamepad();state.hooked=true;updateModeUI();}
$('modeStance').onclick=()=>setMode('stance');$('modeMoves').onclick=()=>setMode('moves');$('btnSquare').onclick=()=>primaryAction('square');$('btnTriangle').onclick=()=>primaryAction('triangle');$('btnCircle').onclick=()=>primaryAction('circle');$('btnCross').onclick=()=>primaryAction('cross');$('btnRateDown').onclick=()=>rate('down');$('btnRateUp').onclick=()=>rate('up');$('btnClear').onclick=()=>rate('');$('downloadCsv').onclick=e=>{e.preventDefault();downloadCsv();};$('downloadJson').onclick=e=>{e.preventDefault();downloadJson();};$('collapseBtn').onclick=()=>{const s=$('shell');s.classList.toggle('collapsed');$('collapseBtn').textContent=s.classList.contains('collapsed')?'+':'−';};
frame.addEventListener('load',()=>setTimeout(hook,400));loadRatings();updateModeUI();pollGamepads();
</script>
</body>
</html>
